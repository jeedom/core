# build docker image based on debian bookworm and trixie
# start all containers and run sick.php
# stop & clean
name: Docker Test Image

on:
  # only trigger CI when pull request on following branches
  pull_request:
    branches:
      - 'develop'
  # this is to manually trigger the worklow
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Reason'
        default: 'Manual launch'

jobs:
  buildAndTestDockerImg:
    runs-on: ubuntu-latest
    steps:
      - name: Check Out Repo
        # Check out the repo, using current branch
        # https://github.com/marketplace/actions/checkout
        uses: actions/checkout@v7

      - name: Resolve branch to test
        # init.sh re-downloads Jeedom from the git ref named by VERSION at container startup,
        # always from jeedom/core, so head_ref only resolves for branches pushed there.
        # A fork PR's head_ref doesn't exist in jeedom/core: use base_ref (develop) instead.
        run: |
          if [ -n "${{ github.event.pull_request.head.repo.full_name }}" ] && [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "PR_BRANCH=${{ github.base_ref }}" >> "$GITHUB_ENV"
          else
            echo "PR_BRANCH=${{ github.head_ref || github.ref_name }}" >> "$GITHUB_ENV"
          fi

      - name: Build jeedom:bookworm
        # build current image for bookworm
        run: |
          docker build -t jeedom:bookworm --build-arg DEBIAN=bookworm --build-arg DATABASE=1 --build-arg VERSION=$PR_BRANCH .
      - name: run jeedom:bookworm and check
        # run current image for bookworm and check it
        run: |
          docker run -p 81:80 -d --rm --name jeedom_bookworm jeedom:bookworm
          until [ "`docker inspect -f {{.State.Health.Status}} jeedom_bookworm`" == "healthy" ]; do
            echo "waiting container to be healthy..."
            sleep 5;
          done;
          docker exec jeedom_bookworm php sick.php

      - name: Build jeedom:trixie
        # build current image for trixie
        run: |
          docker build -t jeedom:trixie --build-arg DEBIAN=trixie --build-arg DATABASE=1 --build-arg VERSION=$PR_BRANCH .
      - name: run jeedom:trixie and check
        # run current image for trixie and check it
        run: |
          docker run -p 82:80 -d --rm --name jeedom_trixie jeedom:trixie
          until [ "`docker inspect -f {{.State.Health.Status}} jeedom_trixie`" == "healthy" ]; do
            echo "waiting container to be healthy..."
            sleep 5;
          done;
          docker exec jeedom_trixie php sick.php

      - name: Clean docker image
        continue-on-error: true
        run: |
          docker stop jeedom_bookworm jeedom_trixie || true
          docker rm jeedom_bookworm jeedom_trixie || true
          docker rmi jeedom:bookworm jeedom:trixie || true
