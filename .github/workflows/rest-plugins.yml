name: REST plugin and update management

on:
  push:
    branches: [eval-api-rest]
    paths:
      - 'core/api/rest/**'
      - 'core/class/plugin*.class.php'
      - 'core/class/update.class.php'
      - 'core/php/jeeRestUpdate.php'
      - 'core/repo/market.repo.php'
      - 'core/repo/url.repo.php'
      - 'core/config/version'
      - 'composer.*'
      - 'tests/rest/**'
      - '.github/workflows/rest-plugins.yml'
  pull_request:
    paths:
      - 'core/api/rest/**'
      - 'core/class/plugin*.class.php'
      - 'core/class/update.class.php'
      - 'core/php/jeeRestUpdate.php'
      - 'core/repo/market.repo.php'
      - 'core/repo/url.repo.php'
      - 'core/config/version'
      - 'composer.*'
      - 'tests/rest/**'
      - '.github/workflows/rest-plugins.yml'

permissions:
  contents: read

jobs:
  plugins:
    name: Plugins and updates / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, dom, gd, mbstring, xml, zip
          coverage: none
      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts
      - name: Check PHP syntax
        run: |
          for file in core/api/rest/src/PluginsController.php core/api/rest/src/UpdatesController.php core/api/rest/src/App.php core/class/plugin.class.php core/class/pluginRepository.class.php core/class/update.class.php core/php/jeeRestUpdate.php core/repo/market.repo.php core/repo/url.repo.php tests/rest/plugins.php tests/rest/updates.php; do
            php -l "$file" || exit 1
          done
      - name: Check plugin API types
        run: vendor/bin/phpstan analyse --configuration=tests/rest/phpstan.neon --no-progress --error-format=github core/api/rest/src/PluginsController.php core/api/rest/src/UpdatesController.php core/class/plugin.class.php core/class/pluginRepository.class.php core/class/update.class.php
      - name: Exercise plugin REST routes and installation jobs
        run: |
          php tests/rest/plugins.php
          php tests/rest/updates.php

