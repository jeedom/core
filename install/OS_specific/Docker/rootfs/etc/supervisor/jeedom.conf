[unix_http_server]
file=/run/jeedom/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
user=root
pidfile=/run/jeedom/supervisord.pid
logfile=/dev/null
logfile_maxbytes=0
childlogdir=/run/jeedom

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/jeedom/supervisor.sock

[eventlistener:critical-service]
command=/usr/bin/python3 /usr/local/lib/jeedom/supervisor-events.py
events=PROCESS_STATE_FATAL,PROCESS_STATE_EXITED
priority=1
buffer_size=50
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:mariadb]
command=/usr/sbin/mariadbd --user=mysql --console --skip-networking --socket=/run/mysqld/mysqld.sock
autostart=%(ENV_JEEDOM_INTERNAL_DB)s
autorestart=false
startsecs=2
startretries=2
priority=10
stopwaitsecs=60
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:bootstrap]
command=/usr/bin/php /usr/local/lib/jeedom/database.php bootstrap
user=root
autostart=true
autorestart=false
startsecs=0
priority=20
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:apache]
command=/usr/local/bin/jeedom-apache
autostart=false
autorestart=false
priority=30
stopsignal=WINCH
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:atd]
command=/usr/sbin/atd -f
autostart=false
autorestart=false
priority=40
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:cron]
command=/usr/sbin/cron -f
autostart=false
autorestart=false
priority=50
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[group:runtime]
programs=apache,atd,cron
priority=30
