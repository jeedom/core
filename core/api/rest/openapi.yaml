            application/json:
              schema:
                $ref: '#/components/schemas/VariableList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags:
      - Variables
      operationId: createVariable
      summary: Créer une variable globale
      description: Crée une variable globale (`scenarioId` nul), comme l'écran Variables. Tout utilisateur authentifié.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VariableCreate'
      responses:
        '201':
