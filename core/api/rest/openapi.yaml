openapi: 3.1.0
info:
  title: API REST Jeedom
  version: 1.0.0-draft
  license:
    name: GPL-3.0-or-later
    identifier: GPL-3.0-or-later
  description: |
    Brouillon de l'API REST du core Jeedom. Elle couvre la ressource pilote
    `/objects` (les objets : pièces, étages, zones…), `/eqLogics` (les
    équipements), `/cmds` (leurs commandes), `/scenarios` et `/crons` (administrateurs).

    Elle reprend les actions de `core/ajax/object.ajax.php` et les méthodes
    JSON-RPC `jeeObject::*` / `summary::*` de `core/api/jeeApi.php`
    (voir `docs/inventaire-api.md`). Les actions qui produisent du HTML
    (`toHtml`, `getSummaryHtml`, `getActionSummary`) ou des listes pour
    l'ancienne interface (`getUISelectList`) ne sont pas reprises : la nouvelle
    UI construit son affichage à partir des données.

    ## Conventions communes
    - Toutes les routes sont préfixées par `/api/v1`.
    - Corps et réponses en JSON, sauf pour les transferts de fichiers documentés.
      Les champs gardent les noms du core
      (`father_id`, `isVisible`…) pour faciliter la migration.
    - Les listes renvoient `{ "items": [...], "total": n }`.
    - Toutes les erreurs renvoient le schéma `Error`, avec un code HTTP
      significatif (400, 401, 403, 404, 409, 422).
    - Une création renvoie `201` et la ressource créée, une suppression `204`.
    - Les références à des commandes dans `configuration` sont renvoyées au
      format lisible `#[Objet][Équipement][Commande]#` et acceptées sous les deux
      formes (`#[…]#` ou `#123#`), comme le font `jeedom::toHumanReadable` et
      `jeedom::fromHumanReadable` aujourd'hui.

    ## Authentification
    Jeton lié à un utilisateur dans l'en-tête `Authorization: Bearer …`, ou
    session de la nouvelle UI. Les droits sont ceux de l'utilisateur :
    lecture pour tout utilisateur connecté, écriture réservée aux
    administrateurs, équipements filtrés selon les droits par élément.
    Dans une liste, un élément que l'utilisateur n'a pas le droit de lire est
    simplement absent ; demandé directement, il renvoie 403.

    La nouvelle UI ouvre une session avec `POST /session` (cookie
    `SameSite=Strict`, même domaine que le core, pas de CORS). En
    session, toute requête d'écriture (`POST`, `PUT`, `PATCH`, `DELETE`) doit
    porter l'en-tête `X-CSRF-Token` avec le jeton reçu à l'ouverture ou lu
    sur `/me` ; sans lui, 403 `csrf_invalid`. Le jeton n'est pas demandé avec
    `Authorization: Bearer`. Une session expirée renvoie 401
    `session_expired`, pour que l'UI revienne à l'écran de connexion.

    ### Sessions de l'API
    Les sessions de Core UI sont stockées dans la table InnoDB `session`.
    Le cookie HttpOnly porte un jeton opaque dont seule l'empreinte est stockée.
    La durée est de 24 h par défaut, ou de 90 jours avec « Rester connecté ».
    L'ancienne interface utilise ses propres sessions PHP.

    ## Configuration (`/config`)
    Réglages globaux du core (table `config`, `plugin = core`), lus et
    modifiés par liste de clés : `GET /config?keys=…` et `PATCH /config`.
    Les noms de clés sont ceux du core, limités à une liste exposée.
    Les définitions des résumés sont la clé `object:summary`. La configuration des plugins passe
    par `/plugins/{id}`.
    - Lecture : tout utilisateur connecté, sauf les clés de
      `config::shouldBeEncrypted()`, réservées aux administrateurs, comme
      `core/ajax/config.ajax.php` ; pour un non-administrateur, elles sont
      absentes de la réponse.
    - Les clés sensibles ne sortent jamais en clair (schéma `ConfigSecret`).
    - Écriture : `PATCH /config`, administrateurs uniquement.
    - Cible future (pas encore appliquée) : une liste blanche des clés
      lisibles par un non-administrateur (thème, widgets, langue, fuseau…,
      voir `docs/inventaire-config.md` de jeevolution) ; le reste deviendra
      réservé aux administrateurs.
    - Les clés dynamiques gardées sont décrites par motif (`patternProperties`) :
      `{dépôt}::enable` et `{dépôt}::allowDNS`. Les niveaux de log par module
      (`log::level::*`), les modes d'accès API (`api::*::mode`, appelés à disparaître avec les utilisateurs techniques) et les
      widgets par défaut (`widget::default::cmd::*`) ne sont pas exposés.
    - Non exposées : les clés jamais lues par le core (`info::address`,
      `info::postalCode`, `info::city`, `info::stateCode`, `info::livingSpace`,
      `info::nbOccupant`, `disableMobileUi`, `internalPort`, `externalPort`,
      `update::composerUpdate`), et celles que la nouvelle UI n'utilisera
      plus (`dahsboard::column::size`, `historyCalculTendanceThresholddMin`,
      `historyCalculTendanceThresholddMax`).
    - Clés renommées par un script de migration du core (l'API n'expose que
      le nouveau nom) : `proxyLogins` → `proxyLogin`, `ldap::enable` →
      `ldap:enable`, `history::defautShowPeriod` → `history::defaultShowPeriod`,
      `dontProtectTooFastLaunchDeamony` → `dontProtectTooFastLaunchDaemon`.

servers:
  - url: /api/v1

security:
  - bearerAuth: []
  - sessionCookie: []

tags:
  - name: Objets
    description: Pièces et zones qui regroupent les équipements, organisées en arbre.
  - name: Équipements
    description: Équipements des plugins (modules, appareils, services), rangés dans les objets.
  - name: Résumés
    description: Valeurs agrégées par objet (température moyenne, lumières allumées…).
  - name: Scénarios
    description: Scénarios d'automatisation, leur contenu, leur lancement et leur journal.
  - name: Variables
    description: Variables du moteur de scénarios (dépôt de données de type scenario).
  - name: Crons
    description: Tâches planifiées du moteur cron, administrateurs uniquement.
  - name: Journaux
    description: Lecture et gestion des fichiers log, administrateurs uniquement.
  - name: Messages
    description: Centre de notifications du core (messages des plugins et du système).
  - name: Sauvegardes
    description: Sauvegardes locales et distantes du core, administrateurs uniquement.
  - name: Plugins
    description: Plugins installés.
  - name: Utilisateurs
    description: Comptes utilisateurs et leurs droits, administrateurs uniquement.
  - name: Session
    description: Utilisateur connecté.
  - name: Commandes
    description: Commandes des équipements, infos (états) et actions.
  - name: Affichage
    description: Réglages de présentation du Dashboard de Core UI.
  - name: Temps réel
    description: Flux d'événements en direct (SSE).
  - name: Configuration
    description: Réglages globaux du core, lus et modifiés par liste de clés.
  - name: Système
    description: Diagnostics et opérations système réservés aux administrateurs.

paths:
  /system:
    get:
      tags: [Système]
      operationId: getSystem
      summary: Lire les informations système
      responses:
        '200':
          description: Informations système.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemInfo' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /system/health:
    get:
      tags: [Système]
      operationId: getSystemHealth
      summary: Lire les diagnostics système
      parameters:
        - name: scope
          in: query
          description: Le périmètre core exclut le compteur global de mises à jour. Sans périmètre, tous les contrôles historiques sont retournés.
          schema: { type: string, enum: [core] }
      responses:
        '200':
          description: Résultats des contrôles de santé.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemHealth' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /system/health/benchmark:
    post:
      tags: [Système]
      operationId: runSystemBenchmark
      summary: Exécuter le benchmark Jeedom
      description: Administrateur. Le benchmark sollicite le cache, la base de données et les sous-processus. Un seul benchmark peut s’exécuter à la fois.
      responses:
        '200':
          description: Durées des mesures en secondes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemBenchmark' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Un benchmark est déjà en cours (`benchmark_running`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: Le verrou du benchmark est indisponible (`benchmark_unavailable`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /system/reboot:
    post:
      tags: [Système]
      operationId: rebootSystem
      summary: Redémarrer le système
      responses:
        '204':
          description: Redémarrage demandé.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/SystemSudoUnavailable' }

  /system/shutdown:
    post:
      tags: [Système]
      operationId: shutdownSystem
      summary: Arrêter le système
      responses:
        '204':
          description: Arrêt demandé.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/SystemSudoUnavailable' }

  /system/time/reference:
    delete:
      tags: [Système]
      operationId: resetSystemTimeReference
      summary: Effacer la dernière heure de référence
      responses:
        '204':
          description: Référence supprimée.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /system/consistency:
    post:
      tags: [Système]
      operationId: checkSystemConsistency
      summary: Lancer la vérification de cohérence
      responses:
        '202':
          description: Vérification lancée en arrière-plan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMaintenanceAccepted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /system/permissions/repair:
    post:
      tags: [Système]
      operationId: repairSystemPermissions
      summary: Réparer les permissions des fichiers Jeedom
      responses:
        '204':
          description: Réparation exécutée.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/SystemSudoUnavailable' }

  /system/database/cleanup:
    post:
      tags: [Système]
      operationId: cleanSystemDatabase
      summary: Lancer le nettoyage de la base
      responses:
        '202':
          description: Nettoyage lancé en arrière-plan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemMaintenanceAccepted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /system/database/schema:
    get:
      tags: [Système]
      operationId: checkSystemDatabaseSchema
      summary: Vérifier le schéma de la base
      responses:
        '200':
          description: Comparaison avec le schéma du core.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemDatabaseSchema' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /system/database/schema/repair:
    post:
      tags: [Système]
      operationId: repairSystemDatabaseSchema
      summary: Réparer le schéma de la base
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [table]
              properties:
                table: { type: string, minLength: 1, description: Nom d’une table du schéma ou `all`. }
      responses:
        '204':
          description: Réparation exécutée.
        '400': { $ref: '#/components/responses/SystemInvalidJson' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /system/database/queries:
    post:
      tags: [Système]
      operationId: executeSystemSql
      summary: Exécuter une requête SQL
      description: |
        Une instruction par connexion. La console accepte les lectures, écritures et
        opérations de schéma qui peuvent être bornées par MariaDB. Les appels de
        procédures, les blocs et les réglages de session sont refusés.
        Le délai MariaDB est de 5 secondes. Un résultat de plus de 1 000 lignes
        ou de plus de 2 Mio est refusé en entier.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [sql]
              properties:
                sql: { type: string, minLength: 1, maxLength: 65536, description: 'Instruction SQL limitée à 64 Kio, avec les droits du compte de base de données Jeedom.' }
      responses:
        '200':
          description: Résultat de la requête.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemSqlResult' }
        '400': { $ref: '#/components/responses/SystemInvalidJson' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/SystemSqlSizeLimit' }
        '422': { $ref: '#/components/responses/SystemSqlError' }
        '504': { $ref: '#/components/responses/SystemSqlTimeout' }

  /system/ssh:
    post:
      tags: [Système]
      operationId: executeSystemShellCommand
      summary: Exécuter une commande shell locale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [command]
              properties:
                command: { type: string, minLength: 1, description: Commande non interactive exécutée par le compte système de PHP depuis le répertoire Jeedom. }
      responses:
        '200':
          description: Sortie et code de retour de la commande.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemShellResult' }
        '400': { $ref: '#/components/responses/SystemInvalidJson' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /system/files/roots:
    get:
      tags: [Système]
      operationId: listSystemFileRoots
      summary: Lister les racines de l’explorateur de fichiers
      description: Réservé aux administrateurs. La racine jeedom correspond au répertoire d’installation.
      responses:
        '200':
          description: Racine Jeedom et droits d’accès.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemFileRoots' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/SystemFileUnavailable' }

  /system/files/entries:
    get:
      tags: [Système]
      operationId: listSystemFileEntries
      summary: Lister le contenu d’un répertoire de Jeedom
      parameters:
        - $ref: '#/components/parameters/SystemFileRoot'
        - name: path
          in: query
          description: Chemin relatif UTF-8 dans la racine. Une valeur vide ou absente désigne la racine.
          schema: { type: string, maxLength: 1024, default: '' }
      responses:
        '200':
          description: Répertoires et fichiers accessibles, y compris les entrées cachées. Les liens et fichiers temporaires de l’éditeur sont exclus.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemFileEntries' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/SystemFileNotFound' }
        '413': { $ref: '#/components/responses/SystemFileLimit' }
        '422': { $ref: '#/components/responses/SystemFileInvalid' }
        '503': { $ref: '#/components/responses/SystemFileUnavailable' }

  /system/files/content:
    parameters:
      - $ref: '#/components/parameters/SystemFileRoot'
      - name: path
        in: query
        required: true
        description: Chemin relatif UTF-8 d’un fichier existant dans la racine.
        schema: { type: string, minLength: 1, maxLength: 1024 }
    get:
      tags: [Système]
      operationId: readSystemFile
      summary: Lire un fichier de Jeedom
      description: Le contenu est un texte UTF-8 limité à 1 Mio, quelle que soit l’extension.
      responses:
        '200':
          description: Contenu et version du fichier.
          headers:
            ETag: { $ref: '#/components/headers/SystemFileETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemFileContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/SystemFileNotFound' }
        '409': { $ref: '#/components/responses/SystemFileChanged' }
        '413': { $ref: '#/components/responses/SystemFileLimit' }
        '415': { $ref: '#/components/responses/SystemFileUnsupported' }
        '422': { $ref: '#/components/responses/SystemFileInvalid' }
        '503': { $ref: '#/components/responses/SystemFileUnavailable' }
    put:
      tags: [Système]
      operationId: writeSystemFile
      summary: Enregistrer un fichier de Jeedom
      description: |
        Remplace atomiquement un fichier texte UTF-8 existant dans le répertoire d’installation
        ou ses sous-répertoires, selon les droits du serveur web et quelle que soit l’extension.
      parameters:
        - $ref: '#/components/parameters/csrfToken'
        - name: If-Match
          in: header
          required: true
          description: ETag fort renvoyé par la dernière lecture ou écriture.
          schema: { type: string, pattern: '^"[a-f0-9]{64}"$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SystemFileContent' }
      responses:
        '204':
          description: Fichier enregistré.
          headers:
            ETag: { $ref: '#/components/headers/SystemFileETag' }
        '400': { $ref: '#/components/responses/SystemFileBadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/SystemFileNotFound' }
        '409': { $ref: '#/components/responses/SystemFileChanged' }
        '412': { $ref: '#/components/responses/SystemFileVersionConflict' }
        '413': { $ref: '#/components/responses/SystemFileLimit' }
        '415': { $ref: '#/components/responses/SystemFileUnsupported' }
        '422': { $ref: '#/components/responses/SystemFileInvalid' }
        '428': { $ref: '#/components/responses/SystemFilePreconditionRequired' }
        '503': { $ref: '#/components/responses/SystemFileUnavailable' }

  /backups:
    get:
      tags: [Sauvegardes]
      operationId: listBackups
      summary: Lister les sauvegardes locales
      description: Archives du dossier de sauvegarde configuré, de la plus récente à la plus ancienne.
      responses:
        '200':
          description: Sauvegardes locales.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackupList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Sauvegardes]
      operationId: startBackup
      summary: Lancer une sauvegarde
      description: Lance le processus natif en arrière-plan. Suivre le résultat dans le journal `backup`.
      responses:
        '202': { $ref: '#/components/responses/BackupAccepted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/BackupInProgress' }
  /backups/archives:
    post:
      tags: [Sauvegardes]
      operationId: uploadBackup
      summary: Téléverser une sauvegarde locale
      description: Ajoute un fichier .tar.gz au dossier de sauvegarde configuré. Limite de 1 Go.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: Sauvegarde enregistrée.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Backup' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Une sauvegarde porte déjà ce nom.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413':
          description: Le fichier dépasse la limite de 1 Go.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /backups/{id}:
    parameters:
      - $ref: '#/components/parameters/BackupId'
    delete:
      tags: [Sauvegardes]
      operationId: deleteBackup
      summary: Supprimer une sauvegarde locale
      responses:
        '204':
          description: Sauvegarde supprimée.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/BackupNotFound' }
        '409':
          description: La sauvegarde ne peut pas être supprimée.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /backups/{id}/archive:
    parameters:
      - $ref: '#/components/parameters/BackupId'
    get:
      tags: [Sauvegardes]
      operationId: downloadBackup
      summary: Télécharger une sauvegarde locale
      responses:
        '200':
          description: Archive téléchargée en flux.
          headers:
            Content-Disposition:
              description: Pièce jointe portant le nom du fichier.
              schema: { type: string }
          content:
            application/gzip:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/BackupNotFound' }
  /backups/{id}/restore:
    parameters:
      - $ref: '#/components/parameters/BackupId'
    post:
      tags: [Sauvegardes]
      operationId: restoreBackup
      summary: Restaurer Jeedom à partir d'une sauvegarde locale
      description: Lance la restauration en arrière-plan. Suivre le résultat dans le journal `restore`.
      responses:
        '202': { $ref: '#/components/responses/BackupAccepted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/BackupNotFound' }
        '409': { $ref: '#/components/responses/BackupInProgress' }
  /backups/repositories:
    get:
      tags: [Sauvegardes]
      operationId: listBackupRepositories
      summary: Lister les dépôts de sauvegarde activés
      responses:
        '200':
          description: Dépôts disponibles.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackupReferenceList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /backups/repositories/{repositoryId}/archives:
    parameters:
      - $ref: '#/components/parameters/BackupRepositoryId'
    get:
      tags: [Sauvegardes]
      operationId: listRemoteBackups
      summary: Lister les sauvegardes d'un dépôt
      responses:
        '200':
          description: Sauvegardes distantes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RemoteBackupList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/BackupNotFound' }
        '502': { $ref: '#/components/responses/BackupRepositoryFailed' }
  /backups/repositories/{repositoryId}/archives/{id}/import:
    parameters:
      - $ref: '#/components/parameters/BackupRepositoryId'
      - $ref: '#/components/parameters/BackupId'
    post:
      tags: [Sauvegardes]
      operationId: importRemoteBackup
      summary: Rapatrier une sauvegarde dans le dossier local
      description: Copie l'archive depuis le dépôt. La restauration de Jeedom est une opération distincte.
      responses:
        '204':
          description: Sauvegarde rapatriée.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/BackupNotFound' }
        '502': { $ref: '#/components/responses/BackupRepositoryFailed' }
  /backups/{id}/exports:
    parameters:
      - $ref: '#/components/parameters/BackupId'
    post:
      tags: [Sauvegardes]
      operationId: exportBackupToCloud
      summary: Envoyer une sauvegarde locale sur le Cloud Jeedom
      description: Le dépôt Market chiffre et envoie l'archive. Le succès confirme la fin du transfert.
      responses:
        '204':
          description: Sauvegarde envoyée.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/BackupNotFound' }
        '502': { $ref: '#/components/responses/BackupRepositoryFailed' }
  /logs:
    get:
      tags:
      - Journaux
      operationId: listLogs
      summary: Lister les journaux (administrateur)
      responses:
        '200':
          description: Lister les journaux.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      description: Noms des fichiers du répertoire log obtenus par log::liste(), tri naturel. Aucun fichier caché,
        répertoire ou nom contenant des caractères shell.
    delete:
      tags:
      - Journaux
      operationId: deleteLogs
      summary: Supprimer les journaux (administrateur)
      responses:
        '200':
          description: Supprimer les journaux.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogRemovalResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      description: Applique log::remove() à chaque journal autorisé. Les fichiers protégés par le core (http.error,
        démons actifs…) sont vidés et conservés ; la réponse distingue fichiers retirés et conservés.
  /logs/{name}:
    parameters:
    - name: name
      in: path
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9][A-Za-z0-9_.-]{0,254}$
    get:
      tags:
      - Journaux
      operationId: getLog
      summary: Lire un extrait brut du journal (administrateur)
      responses:
        '200':
          description: Lire un extrait brut du journal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          description: Limite de lecture dépassée (log_line_too_long ou log_scan_limit).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'
        '404':
          description: Journal inconnu ou nom interdit (log_not_found).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: Lignes dans l’ordre du fichier, sans HTML, avec indentation et lignes vides préservées. start est
        un numéro de ligne commençant à 0. nextStart fournit la page suivante. Lecture bornée à 1 Mio par extrait,
        64 Kio par ligne et 16 Mio de parcours avant start ; un dépassement de ligne/parcours renvoie 413.
      parameters:
      - name: start
        in: query
        schema:
          type: integer
          minimum: 0
          maximum: 1000000
          default: 0
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 300
    delete:
      tags:
      - Journaux
      operationId: deleteLog
      summary: Supprimer le journal (administrateur)
      responses:
        '200':
          description: Supprimer le journal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogRemoval'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Journal inconnu ou nom interdit (log_not_found).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: Applique log::remove(). removed=false signifie que le fichier existe encore, notamment lorsqu’il
        est protégé par le core.
  /logs/{name}/download:
    parameters:
    - name: name
      in: path
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9][A-Za-z0-9_.-]{0,254}$
    get:
      tags: [Journaux]
      operationId: downloadLog
      summary: Télécharger le journal brut (administrateur)
      responses:
        '200':
          description: Fichier complet, transmis sans conversion ni pagination.
          headers:
            Content-Disposition:
              schema: { type: string }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /logs/{name}/contents:
    parameters:
    - name: name
      in: path
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9][A-Za-z0-9_.-]{0,254}$
    delete:
      tags:
      - Journaux
      operationId: clearLog
      summary: Vider le journal (administrateur)
      responses:
        '204':
          description: Vider le journal.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Journal inconnu ou nom interdit (log_not_found).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Journal non modifiable (log_not_clearable).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /variables:
    get:
      tags:
      - Variables
      operationId: listVariables
      summary: Lister les variables des scénarios
      description: Variables de type `scenario`, triées par nom, comme `dataStore.ajax.php` (action `all`). Tout utilisateur authentifié. Sans pagination, retourne toutes les variables.
      parameters:
      - name: q
        in: query
