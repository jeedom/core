    post:
      tags:
      - Plugins
      operationId: stopPluginDaemon
      summary: Arrêter le démon.
      responses:
        '200':
          description: Résultat de l’opération.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginDaemon'
        default:
          description: 'Erreur explicite : droits, validation, plugin absent, conflit, Market indisponible ou mode
            démo.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
  /plugins/{id}/community-post:
    parameters:
    - $ref: '#/components/parameters/PluginId'
    get:
      tags:
      - Plugins
      operationId: getPluginCommunityPost
      summary: Préparer le lien de brouillon Community, sans publier de message.
      responses:
        '200':
          description: Résultat de l’opération.
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                  plugin:
                    type: string
                required:
                - url
                - plugin
        default:
          description: 'Erreur explicite : droits, validation, plugin absent, conflit, Market indisponible ou mode
            démo.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /plugins/{id}/installations/latest:
    parameters:
    - $ref: '#/components/parameters/PluginId'
    get:
      tags:
      - Plugins
      operationId: getLatestPluginInstallation
      summary: Retrouver la dernière installation demandée pour ce plugin.
      responses:
        '200':
          description: Résultat de l’opération.
          content:
            application/json:
              schema:
                type: object
                properties:
                  operation:
                    oneOf:
                    - $ref: '#/components/schemas/PluginInstallation'
                    - type: 'null'
                required:
                - operation
        default:
          description: 'Erreur explicite : droits, validation, plugin absent, conflit, Market indisponible ou mode
            démo.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /plugins/installations/preview:
    get:
      tags:
      - Plugins
      operationId: preparePluginInstallation
      summary: Préparer la confirmation d’installation depuis le Market.
      responses:
        '200':
          description: Résultat de l’opération.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginInstallationPreview'
        default:
          description: 'Erreur explicite : droits, validation, plugin absent, conflit, Market indisponible ou mode
            démo.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: marketId
        in: query
        required: true
        schema:
          type: integer
          minimum: 1
          maximum: 2147483647
      - name: version
        in: query
        required: true
        schema:
          type: string
          enum:
          - stable
          - beta
      description: Administrateur. Résout l’identifiant numérique auprès du Market configuré sur la box et vérifie
        publication, achat/licence, branche, Core, OS et plateforme. Aucune installation, activation, création de
        tâche ou modification de branche.
  /plugins/installations:
    post:
      tags:
      - Plugins
      operationId: startPluginInstallation
      summary: Confirmer et planifier l’installation Market.
      responses:
        '202':
          description: Résultat de l’opération.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginInstallation'
        default:
          description: 'Erreur explicite : droits, validation, plugin absent, conflit, Market indisponible ou mode
            démo.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: Dernière opération terminée retrouvée par sa clé de requête.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginInstallation'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                marketId:
                  type: integer
                  minimum: 1
                  maximum: 2147483647
                version:
                  type: string
                  enum:
                  - stable
                  - beta
              required:
              - marketId
              - version
              additionalProperties: false
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{16,128}$
      description: Administrateur, hors démo, CSRF en session. Branche explicite. La même clé pour la dernière opération
        renvoie son état sans lancer une autre installation ; une autre clé concurrente donne 409. La queue native
        exécute update::doUpdate et revérifie les droits, l’accès Market et la compatibilité. Première installation
        inactive, réglages et état existants conservés. La réussite concerne les fichiers du plugin ; dépendances
        et activation restent distinctes.
  /plugins/installations/{operationId}/status:
    get:
      tags:
      - Plugins
      operationId: getPluginInstallation
      summary: Suivre le résultat réel d’une installation.
      responses:
        '200':
          description: Résultat de l’opération.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginInstallation'
        default:
          description: 'Erreur explicite : droits, validation, plugin absent, conflit, Market indisponible ou mode
            démo.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: operationId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_][A-Za-z0-9_-]{0,126}\.[a-f0-9]{32}$
      description: Administrateur. État persisté de la dernière opération de ce plugin ; une ancienne référence remplacée
        renvoie 404. Une tâche interrompue donne failed, jamais succeeded. Aucun GET ne lance ou ne rejoue une installation.

  /session:
    post:
      tags: [Session]
      operationId: openSession
      summary: Ouvrir une session (connexion)
      description: |
        Remplace l'ajax `user::login`, avec la même logique que `login()` de
        `core/php/authentification.php` : compte actif, utilisateur « local
        uniquement », double authentification hors du réseau local,
        enregistrement de l'appareil, journal et bannissement après trop
        d'échecs. Crée une ligne dans la table `session`, pose le cookie
        (qui porte le jeton, dont seule l'empreinte est stockée) et renvoie
        l'utilisateur avec le jeton CSRF. Seule route accessible sans être connecté.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Session ouverte (en-tête `Set-Cookie`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401':
          description: |
            Connexion refusée, avec un code stable :
            `invalid_credentials` (identifiant ou mot de passe faux, compte
            désactivé, ou utilisateur local connecté de l'extérieur),
            `two_factor_required` (renvoyer la demande avec `twoFactorCode`),
            `two_factor_invalid` (code faux).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 'Adresse IP bannie après trop d''échecs (`code: ip_banned`).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Session]
      operationId: closeSession
      summary: Fermer la session (déconnexion)
      description: |
        Révoque la session courante et efface son cookie. Demande l'en-tête `X-CSRF-Token`.
      security:
        - sessionCookie: []
      responses:
        '204': { description: 'Session fermée, cookie effacé.' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 'Jeton CSRF absent ou faux (`code: csrf_invalid`).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /me:
    get:
      tags: [Session]
      operationId: getMe
      summary: Utilisateur connecté
      description: |
        Renvoie l'utilisateur du jeton ou de la session, pour que l'UI
        adapte l'affichage (ex. masquer les actions d'administration).
        Équivaut à `isConnect('admin')` pour `isAdmin`. Les droits restent
        vérifiés par chaque route.
      responses:
        '200':
          description: L'utilisateur connecté.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Session]
      operationId: updateMe
      summary: Modifier son propre compte
      description: |
        Remplace l'ajax `user::saveProfils` (page « Préférences »), pour tout
        profil. Seuls le mot de passe et les préférences de `MePreferences`
        sont acceptés ; le profil, l'activation et les droits restent aux
        administrateurs. `preferences` est fusionné clé par clé ; une clé
        inconnue (y compris les préférences de plugins `plugin::<id>::<clé>`,
        à traiter avec la spec des plugins) renvoie 422. Changer de mot de
        passe demande l'ancien (`currentPassword`) : s'il est faux, 422
        `invalid_current_password` ; le nouveau suit la règle de
        `NewPassword` (sinon 422 `weak_password`). Le jeton API se gère avec
        `/me/token`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MeUpdate' }
            example: { preferences: { homePage: 'core::dashboard', defaultDashboardObject: 3 } }
      responses:
        '200':
          description: Compte modifié.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 'Jeton CSRF absent ou faux (`code: csrf_invalid`), ou compte système.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /me/token:
    get:
      tags: [Session]
      operationId: getMyToken
      summary: Lire son jeton API
      description: |
        Renvoie le jeton (`hash` du core) à utiliser dans `Authorization:
        Bearer …`. Le jeton n'apparaît jamais dans `/users`, même pour un
        administrateur. Comptes système refusés.
      responses:
        '200':
          description: Le jeton.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiToken' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Session]
      operationId: regenerateMyToken
      summary: Régénérer son jeton API
      description: |
        Crée un nouveau jeton ; l'ancien cesse aussitôt de fonctionner (les
        intégrations qui l'utilisent devront être mises à jour). Remet à zéro
        la date de rotation automatique (`hashGenerated`).
      responses:
        '201':
          description: Le nouveau jeton.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiToken' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 'Jeton CSRF absent ou faux (`code: csrf_invalid`), ou compte système.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /me/devices:
    get:
      tags: [Session]
      operationId: listMyDevices
      summary: Lister ses appareils enregistrés
      description: |
        Sessions longues ouvertes avec « Rester connecté ». La clé identifie
        la session dans la liste, indépendamment du jeton du cookie.
      responses:
        '200':
          description: Les appareils.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [Session]
      operationId: forgetMyDevices
      summary: Oublier tous ses appareils
      description: Révoque toutes les sessions longues de son compte.
      responses:
        '204': { description: Appareils oubliés. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/devices/{key}:
    parameters:
      - $ref: '#/components/parameters/DeviceKey'
    delete:
      tags: [Session]
      operationId: forgetMyDevice
      summary: Oublier un appareil
      description: Révoque la session longue associée.
      responses:
        '204': { description: Appareil oublié. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: 'Appareil inconnu (`code: device_not_found`).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /me/sessions:
    get:
      tags: [Session]
      operationId: listMySessions
      summary: Lister ses sessions ouvertes
      description: |
        Sessions actives de Core UI pour ce compte. L'identifiant public est
        indépendant du jeton d'authentification.
      responses:
        '200':
          description: Les sessions.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionInfoList' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/sessions/{sessionId}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    delete:
      tags: [Session]
      operationId: closeMySession
      summary: Fermer une de ses sessions
      description: |
        Révoque une session de son compte. Une session d'un autre compte renvoie 404.
        Pour fermer la session courante, utiliser `DELETE /session` (sinon 409).
      responses:
        '204': { description: Session fermée. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/CurrentSession' }
        '404':
          description: 'Session inconnue (`code: session_not_found`).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /users:
    get:
      tags: [Utilisateurs]
      operationId: listUsers
      summary: Lister les utilisateurs (administrateur)
      description: |
        Remplace l'ajax `user::all`. Renvoie tous les comptes, y compris les
        comptes système `internal_report` et `jeedom_support` (marqués
        `kind: system`) et les comptes techniques des démons de plugins
        (`kind: plugin`). Jamais de mot de passe, de `hash` ni de donnée de
        double authentification.
      parameters:
        - name: profils
          in: query
          description: Ne garder que ce profil.
          schema: { $ref: '#/components/schemas/UserProfile' }
        - name: enable
          in: query
          description: Ne garder que les comptes actifs (`true`) ou désactivés (`false`).
          schema: { type: boolean }
        - name: kind
          in: query
          description: Ne garder que cette nature de compte (ex. `human` pour masquer les comptes système et de plugins).
          schema: { $ref: '#/components/schemas/UserKind' }
      responses:
        '200':
          description: Liste des utilisateurs.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Utilisateurs]
      operationId: createUser
      summary: Créer un utilisateur (administrateur)
      description: |
        Remplace l'ajax `user::save` sans `id`. Seuls `login` et `password`
        sont acceptés : le compte est créé avec le profil `user`, actif, et
        l'accès API désactivé (`options.api::mode = disable`). Le profil, les
        options et les droits se règlent ensuite avec `PATCH /users/{id}` et
        `PUT /users/{id}/rights`. Refusé si l'authentification LDAP est
        active (les comptes viennent alors de l'annuaire).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserCreate' }
            example: { login: marie, password: 'Un-mot-de-passe-solide-42' }
      responses:
        '201':
          description: Utilisateur créé.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/UserConflict' }
        '422':
          description: |
            Données invalides (`validation_error` : login ou mot de passe
            vide, login réservé `internal_report` / `jeedom_support`),
            `weak_password` (mot de passe hors de la règle de
            `NewPassword`), ou `ldap_enabled` : création impossible tant que
            LDAP est actif.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /users/{id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Utilisateurs]
      operationId: getUser
      summary: Lire un utilisateur (administrateur)
      description: Remplace l'ajax `user::get` avec `id`.
      responses:
        '200':
          description: L'utilisateur.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/UserNotFound' }
    patch:
      tags: [Utilisateurs]
      operationId: updateUser
      summary: Modifier un utilisateur (administrateur)
      description: |
        Remplace l'ajax `user::save` avec `id`. Seuls les champs de
        `UserUpdate` sont acceptés ; `options` est fusionné clé par clé.
        Règles reprises du core :
        - les comptes système (`internal_report`, `jeedom_support`) ne sont
          pas modifiables : 403 `user_system` ;
        - on ne peut pas se désactiver soi-même ni retirer son propre profil
          administrateur : 422 `user_self_lockout` ;
        - le dernier administrateur actif ne peut être ni désactivé ni
          rétrogradé : 422 `last_admin` ;
        - désactiver un compte (`enable: false`) révoque ses sessions Core UI.

        Les droits par élément ne passent pas ici mais par
        `/users/{id}/rights`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdate' }
            example: { profils: restrict, options: { localOnly: 1 } }
      responses:
        '200':
          description: Utilisateur modifié.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 'Droits insuffisants, ou compte système non modifiable (`code: user_system`).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/UserNotFound' }
        '409': { $ref: '#/components/responses/UserConflict' }
        '422':
          description: |
            Données invalides (`validation_error`), `weak_password` (mot de
            passe hors de la règle de `NewPassword`), `user_self_lockout`
            (se désactiver ou quitter son profil admin) ou `last_admin`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [Utilisateurs]
      operationId: deleteUser
      summary: Supprimer un utilisateur (administrateur)
      description: |
        Remplace l'ajax `user::remove`. Refusé si LDAP est actif ou si c'est
        son propre compte.
      responses:
        '204': { description: Utilisateur supprimé. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/UserNotFound' }
        '422':
          description: '`ldap_enabled` (suppression impossible tant que LDAP est actif) ou `user_self_delete`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /users/{id}/devices:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Utilisateurs]
      operationId: listUserDevices
      summary: Lister les appareils enregistrés d'un utilisateur (administrateur)
      description: Même contenu que `GET /me/devices`, pour un autre compte.
      responses:
        '200':
          description: Les appareils.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/UserNotFound' }
    delete:
      tags: [Utilisateurs]
      operationId: forgetUserDevices
      summary: Oublier tous les appareils d'un utilisateur (administrateur)
      description: Révoque toutes les sessions longues de ce compte.
      responses:
        '204': { description: Appareils oubliés. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/UserNotFound' }

  /users/{id}/devices/{key}:
    parameters:
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/DeviceKey'
    delete:
      tags: [Utilisateurs]
      operationId: forgetUserDevice
      summary: Oublier un appareil d'un utilisateur (administrateur)
      description: Révoque la session longue associée.
      responses:
        '204': { description: Appareil oublié. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: 'Utilisateur inconnu (`user_not_found`) ou appareil inconnu (`device_not_found`).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /users/{id}/sessions:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Utilisateurs]
      operationId: listUserSessions
      summary: Lister les sessions d'un utilisateur (administrateur)
      description: Même contenu que `GET /me/sessions`, pour un autre compte.
      responses:
        '200':
          description: Les sessions.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionInfoList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/UserNotFound' }
    delete:
      tags: [Utilisateurs]
      operationId: closeUserSessions
      summary: Fermer toutes les sessions d'un utilisateur (administrateur)
      description: Révoque toutes les sessions de Core UI de ce compte.
      responses:
        '204': { description: Sessions fermées. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/UserNotFound' }

  /users/{id}/sessions/{sessionId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/SessionId'
    delete:
      tags: [Utilisateurs]
      operationId: closeUserSession
      summary: Fermer une session d'un utilisateur (administrateur)
      description: Révoque une session de Core UI de ce compte.
      responses:
        '204': { description: Session fermée. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: 'Utilisateur inconnu (`user_not_found`) ou session inconnue de cet utilisateur (`session_not_found`).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409': { $ref: '#/components/responses/CurrentSession' }

  /users/{id}/rights:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Utilisateurs]
      operationId: getUserRights
      summary: Lire les droits par élément (administrateur)
      description: |
        Droits d'un utilisateur au profil `restrict` sur chaque élément
        (champ `rights` du core). Une clé absente vaut `n` (aucun accès). Les
        droits n'ont d'effet que pour le profil `restrict`.
      responses:
        '200':
          description: Les droits.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserRights' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/UserNotFound' }
    put:
      tags: [Utilisateurs]
      operationId: replaceUserRights
      summary: Remplacer les droits par élément (administrateur)
      description: |
        Remplace l'enregistrement de la fenêtre « Droits » (`user::save` avec
        `rights`). Le corps devient l'ensemble des droits : une clé omise
        repasse à `n`. Comptes système refusés (403 `user_system`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserRights' }
      responses:
        '200':
          description: Droits enregistrés.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserRights' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 'Droits insuffisants, ou compte système (`code: user_system`).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/UserNotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /users/{id}/rights/copy:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [Utilisateurs]
      operationId: copyUserRights
      summary: Copier les droits vers un autre utilisateur (administrateur)
      description: |
        Remplace l'ajax `user::copyRights`. Les droits de `{id}` sont écrits
        sur l'utilisateur `to`, clé par clé : les clés que `{id}` n'a pas
        restent inchangées chez `to`, comme aujourd'hui.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [to]
              properties:
                to: { type: integer, minimum: 1, description: Utilisateur qui reçoit les droits., example: 4 }
      responses:
        '200':
          description: Droits de l'utilisateur cible après copie.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserRights' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 'Droits insuffisants, ou cible compte système (`code: user_system`).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/UserNotFound' }
        '422':
          description: '`to` inconnu ou égal à `{id}` (`validation_error`).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /objects:
    get:
      tags: [Objets]
      operationId: listObjects
      summary: Lister les objets
      description: |
        Remplace l'ajax `all` et le JSON-RPC `jeeObject::all`. Les objets sont
        renvoyés dans l'ordre de l'arbre (parents puis enfants, selon `position`).
      parameters:
        - name: visible
          in: query
          description: Ne renvoyer que les objets visibles (`isVisible`).
          schema: { type: boolean, default: true }
        - name: withEqLogicType
          in: query
          description: |
            Ne garder que les objets contenant au moins un équipement de ce type
            (identifiant de plugin, ex. `virtual`). Remplace `onlyHasEqLogic`.
          schema: { type: string, example: virtual }
        - name: searchChildren
          in: query
          description: Avec `withEqLogicType`, chercher aussi dans les objets enfants.
          schema: { type: boolean, default: true }
      responses:
        '200':
          description: Liste des objets.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ObjectList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Objets]
      operationId: createObject
      summary: Créer un objet
      description: Remplace l'ajax `save` et le JSON-RPC `jeeObject::save` sans `id`. Réservé aux administrateurs.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ObjectCreate' }
      responses:
        '201':
          description: Objet créé.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Object' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /objects/order:
    put:
      tags: [Objets]
      operationId: reorderObjects
      summary: Réordonner les objets
      description: |
        Remplace l'ajax `setOrder`. Les objets prennent les positions 1, 2, 3…
        dans l'ordre donné ; les identifiants inconnus sont ignorés. Réservé aux
        administrateurs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  items: { type: integer }
                  example: [3, 1, 2]
      responses:
        '204': { description: Ordre enregistré. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /objects/{id}:
    parameters:
      - $ref: '#/components/parameters/ObjectId'
    get:
      tags: [Objets]
      operationId: getObject
      summary: Lire un objet
      description: |
        Remplace l'ajax `byId` et les JSON-RPC `jeeObject::byId` /
        `jeeObject::fullById`. Avec `include=eqLogics`, ajoute les équipements
        de l'objet et leurs commandes, filtrés selon les droits de l'utilisateur.
      parameters:
        - name: include
          in: query
          description: Données liées à inclure.
          schema:
            type: array
            items: { type: string, enum: [eqLogics] }
          style: form
          explode: false
      responses:
        '200':
          description: L'objet.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Object' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Objets]
      operationId: updateObject
      summary: Modifier un objet
      description: |
        Remplace l'ajax `save` et le JSON-RPC `jeeObject::save` avec `id`. Seuls
        les champs envoyés sont modifiés ; `configuration` et `display` sont
        fusionnés clé par clé, comme `utils::a2o` aujourd'hui. Réservé aux
        administrateurs.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ObjectUpdate' }
      responses:
        '200':
          description: Objet modifié.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Object' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Objets]
      operationId: deleteObject
      summary: Supprimer un objet
      description: |
        Remplace l'ajax `remove`. La suppression est inscrite dans l'historique
        des suppressions. Rien d'autre n'est supprimé : les équipements et
        scénarios de l'objet n'ont plus d'objet, ses enfants sont rattachés à
        son propre parent, et ses variables et son image sont effacées.
        Réservé aux administrateurs.
      responses:
        '204': { description: Objet supprimé. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /objects/{id}/children:
    parameters:
      - $ref: '#/components/parameters/ObjectId'
    get:
      tags: [Objets]
      operationId: listObjectChildren
      summary: Lister les enfants directs d'un objet
      description: Remplace l'ajax `getChild`.
      responses:
        '200':
          description: Enfants directs.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ObjectList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /objects/{id}/eqLogics/order-by-usage:
    parameters:
      - $ref: '#/components/parameters/ObjectId'
    post:
      tags: [Objets]
      operationId: orderObjectEqLogicsByUsage
      summary: Trier les équipements de l'objet par usage
      description: Remplace l'ajax `orderEqLogicByUsage`. Réservé aux administrateurs.
      responses:
        '200':
          description: Objet après le tri.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Object' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /objects/{id}/image:
    parameters:
      - $ref: '#/components/parameters/ObjectId'
    put:
      tags: [Objets]
      operationId: uploadObjectImage
      summary: Remplacer l'image d'un objet
      description: |
        Remplace l'ajax `uploadImage`, en mode envoi de fichier uniquement :
        formats jpg, jpeg, png, gif, svg, webp, 5 Mo au plus. Le mode actuel où
        l'ajax lit un chemin de fichier sur le serveur (`file`) n'est pas repris.
        Réservé aux administrateurs.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: Objet avec sa nouvelle image.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Object' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413':
          description: Fichier trop volumineux (plus de 5 Mo).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Objets]
      operationId: deleteObjectImage
      summary: Supprimer l'image d'un objet
      description: Remplace l'ajax `removeImage`. Réservé aux administrateurs.
      responses:
        '204': { description: Image supprimée. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /objects/summary:
    get:
      tags: [Résumés]
      operationId: getGlobalSummary
      summary: Lire le résumé global
      description: |
        Remplace le JSON-RPC `summary::global`. Sans `key`, renvoie toutes les
        clés de résumé définies avec leur valeur ; avec `key`, la valeur seule.
      parameters:
        - $ref: '#/components/parameters/SummaryKeyQuery'
      responses:
        '200':
          description: Résumé global.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SummaryResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /objects/summary/{key}/virtual:
    parameters:
      - $ref: '#/components/parameters/SummaryKey'
    post:
      tags: [Résumés]
      operationId: createSummaryVirtual
      summary: Créer les équipements virtuels d'un résumé
      description: |
        Remplace l'ajax `createSummaryVirtual` : crée ou met à jour les
        équipements Virtuel qui exposent ce résumé (nécessite le plugin
        Virtuel). Réservé aux administrateurs.
      responses:
        '204': { description: Équipements virtuels créés ou mis à jour. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /objects/{id}/summary:
    parameters:
      - $ref: '#/components/parameters/ObjectId'
    get:
      tags: [Résumés]
      operationId: getObjectSummary
      summary: Lire le résumé d'un objet
      description: Remplace le JSON-RPC `summary::byId`.
      parameters:
        - $ref: '#/components/parameters/SummaryKeyQuery'
        - name: raw
          in: query
          description: Renvoyer les valeurs brutes, sans arrondi ni mise en forme.
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Résumé de l'objet.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SummaryResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /objects/{id}/summary/{key}/eqLogics:
    parameters:
      - $ref: '#/components/parameters/ObjectId'
      - $ref: '#/components/parameters/SummaryKey'
    get:
      tags: [Résumés]
      operationId: listSummaryEqLogics
      summary: Lister les équipements qui alimentent un résumé
      description: Remplace l'ajax `getEqLogicsFromSummary`.
      parameters:
        - name: enabled
          in: query
          description: Ne garder que les équipements activés.
          schema: { type: boolean, default: false }
        - name: visible
          in: query
          description: Ne garder que les équipements visibles.
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Équipements concernés.
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/EqLogicRef' }
                  total: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /eqLogics:
    get:
      tags: [Équipements]
      operationId: listEqLogics
      summary: Lister les équipements
      description: |
        Remplace les ajax `listByObject`, `listByType`, `byLogical` et les
        JSON-RPC `eqLogic::all`, `eqLogic::byType`, `eqLogic::byObjectId`.
        Les équipements que l'utilisateur n'a pas le droit de lire sont
        retirés de la liste, et de `total`. Triés par `order`, puis par nom,
        puis par `id` (ordre stable, les pages ne se chevauchent pas).
        `total` compte les équipements qui correspondent aux filtres et à
        `q`, avant `limit` et `offset`.
      parameters:
        - name: q
          in: query
          description: |
            Recherche libre. Chaque mot doit se retrouver dans au moins un de
            ces champs : nom, nom de l'objet, plugin (`eqType_name`),
            étiquettes, commentaire. Sans tenir compte des majuscules ni des
            accents.
          schema: { type: string, maxLength: 200, example: lampe salon }
        - $ref: '#/components/parameters/ListLimit'
        - $ref: '#/components/parameters/ListOffset'
        - name: objectId
          in: query
          description: Ne garder que les équipements de cet objet. `0` pour les équipements sans objet.
          schema: { type: integer, minimum: 0 }
        - name: eqType
          in: query
          description: Ne garder que les équipements de ce plugin (ex. `virtual`).
          schema: { type: string, example: virtual }
        - name: logicalId
          in: query
          description: Ne garder que les équipements de cet identifiant logique (à combiner avec `eqType`).
          schema: { type: string }
        - name: enabled
          in: query
          description: Filtrer sur l'état activé. Sans ce paramètre, tous les équipements sont renvoyés.
          schema: { type: boolean }
        - name: visible
          in: query
          description: Filtrer sur la visibilité. Sans ce paramètre, tous les équipements sont renvoyés.
          schema: { type: boolean }
        - $ref: '#/components/parameters/EqLogicInclude'
      responses:
        '200':
          description: Liste des équipements.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EqLogicList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Équipements]
      operationId: createEqLogic
      summary: Créer un équipement
      description: |
        Remplace l'ajax `save` et le JSON-RPC `eqLogic::save` sans `id`. Le
        plugin (`eqType_name`) doit être installé : ses règles de création
        s'appliquent et peuvent refuser l'équipement (422) ou lui créer des
        commandes. Les commandes se gèrent avec la ressource `/cmds`.
        Réservé aux administrateurs.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EqLogicCreate' }
      responses:
        '201':
          description: Équipement créé.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EqLogic' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/EqLogicConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

    patch:
      tags: [Équipements]
      operationId: updateEqLogics
      summary: Modifier plusieurs équipements
      description: |
        Remplace les ajax `setIsEnables`, `setIsVisibles` et `setGenericType`.
        Applique les mêmes changements à chaque équipement de la liste. Un
        équipement qui échoue (inconnu, pas le droit d'écriture, refusé par
        son plugin) n'arrête pas les autres : la réponse dit lesquels ont été
        traités et lesquels ont échoué. Réservé aux administrateurs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, changes]
              properties:
                ids: { $ref: '#/components/schemas/EqLogicIds' }
                changes:
                  type: object
                  minProperties: 1
                  properties:
                    isEnable: { type: boolean }
                    isVisible: { type: boolean }
                    generic_type: { type: [string, 'null'], maxLength: 255 }
            example: { ids: [12, 4, 7], changes: { isEnable: false } }
      responses:
        '200':
          description: Résultat pour chaque équipement.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /eqLogics/delete:
    post:
      tags: [Équipements]
      operationId: deleteEqLogics
      summary: Supprimer plusieurs équipements
      description: |
        Remplace l'ajax `removes`. Chaque équipement est supprimé comme avec
        `DELETE /eqLogics/{id}`. Un équipement qui échoue n'arrête pas les
        autres : la réponse dit lesquels ont été supprimés et lesquels ont
        échoué. Route en `POST` car un corps de requête sur `DELETE` est mal
        pris en charge par certains outils. Réservé aux administrateurs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids: { $ref: '#/components/schemas/EqLogicIds' }
            example: { ids: [12, 4, 7] }
      responses:
        '200':
          description: Résultat pour chaque équipement.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /eqLogics/order:
    put:
      tags: [Équipements]
      operationId: reorderEqLogics
      summary: Réordonner des équipements
      description: |
        Remplace l'ajax `setOrder`, en ne changeant que l'ordre (l'ajax
        actuel accepte n'importe quel champ et ne vérifie aucun droit). Les
        équipements prennent les positions 1, 2, 3… dans l'ordre donné ; les
        identifiants inconnus sont ignorés. Réservé aux administrateurs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  items: { type: integer }
                  example: [12, 4, 7]
      responses:
        '204': { description: Ordre enregistré. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /eqLogics/{id}:
    parameters:
      - $ref: '#/components/parameters/EqLogicId'
    get:
      tags: [Équipements]
      operationId: getEqLogic
      summary: Lire un équipement
      description: |
        Remplace les ajax `byId` et `get`, et les JSON-RPC `eqLogic::byId` /
        `eqLogic::fullById`. Avec `include=cmds`, ajoute les commandes de
        l'équipement. Un équipement que l'utilisateur n'a pas le droit de
        lire renvoie 403.
      parameters:
        - $ref: '#/components/parameters/EqLogicInclude'
      responses:
        '200':
          description: L'équipement.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EqLogic' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/EqLogicNotFound' }
    patch:
      tags: [Équipements]
      operationId: updateEqLogic
      summary: Modifier un équipement
      description: |
        Remplace les ajax `save` et `simpleSave` avec `id`, `setIsEnable`,
        `setIsVisibles`, `setIsEnables`, `setGenericType`, et le JSON-RPC
        `eqLogic::save` avec `id`. Seuls les champs envoyés sont modifiés ;
        `configuration`, `display` et `category` sont fusionnés clé par clé.
        Les règles du plugin s'appliquent. Réservé aux administrateurs ayant
        le droit d'écriture sur l'équipement.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EqLogicUpdate' }
      responses:
        '200':
          description: Équipement modifié.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EqLogic' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/EqLogicNotFound' }
        '409': { $ref: '#/components/responses/EqLogicConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Équipements]
      operationId: deleteEqLogic
      summary: Supprimer un équipement
      description: |
        Remplace les ajax `remove` et `removes`. Supprime aussi ses commandes,
        ses données de vues et ses variables, et inscrit la suppression dans
        l'historique des suppressions. Le plugin peut refuser la suppression
        (409). Réservé aux administrateurs ayant le droit d'écriture sur
        l'équipement.
      responses:
        '204': { description: Équipement supprimé. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/EqLogicNotFound' }
        '409':
          description: |
            Le plugin a refusé la suppression (`code: eqlogic_remove_refused`,
            avec le message du plugin s'il en donne un).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /eqLogics/{id}/copy:
    parameters:
      - $ref: '#/components/parameters/EqLogicId'
    post:
      tags: [Équipements]
      operationId: copyEqLogic
      summary: Dupliquer un équipement
      description: |
        Remplace l'ajax `copy`. La copie reprend la configuration et les
        commandes de l'original, dans le même objet, sous le nom donné.
        Réservé aux administrateurs ayant le droit de lecture sur l'original.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 127, example: Lampe salon (copie) }
      responses:
        '201':
          description: Copie créée.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EqLogic' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/EqLogicNotFound' }
        '409': { $ref: '#/components/responses/EqLogicConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /eqLogics/{id}/usages:
    parameters:
      - $ref: '#/components/parameters/EqLogicId'
    get:
      tags: [Équipements]
      operationId: listEqLogicUsages
      summary: Lister ce qui utilise un équipement
      description: |
        Remplace les ajax `usedBy` et `getUseBeforeRemove` : commandes,
        équipements, scénarios, designs, vues, interactions et plugins qui
        font référence à l'équipement ou à ses commandes. À consulter avant
        une suppression. Réservé aux administrateurs.
      responses:
        '200':
          description: Utilisations, par type d'élément.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EqLogicUsages' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/EqLogicNotFound' }

  /eqLogics/{id}/image:
    parameters:
      - $ref: '#/components/parameters/EqLogicId'
    put:
      tags: [Équipements]
      operationId: uploadEqLogicImage
      summary: Remplacer l'image d'un équipement
      description: |
        Remplace l'ajax `uploadImage`, en mode envoi de fichier uniquement :
        formats jpg, jpeg, png, gif, svg, webp, 5 Mo au plus. Le mode actuel
        où l'ajax lit un chemin de fichier sur le serveur (`file`) n'est pas
        repris. Réservé aux administrateurs ayant le droit d'écriture sur
        l'équipement.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: Équipement avec sa nouvelle image.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EqLogic' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/EqLogicNotFound' }
        '413':
          description: Fichier trop volumineux (plus de 5 Mo).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Équipements]
      operationId: deleteEqLogicImage
      summary: Supprimer l'image d'un équipement
      description: |
        Remplace l'ajax `removeImage` : supprime le fichier et efface
        `image` de l'équipement (l'ajax actuel oublie cette seconde étape).
        Réservé aux administrateurs ayant le droit d'écriture sur
        l'équipement.
      responses:
        '204': { description: Image supprimée. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/EqLogicNotFound' }

  /display:
    get:
      tags: [Affichage]
      operationId: listDisplay
      summary: Lister les réglages d’affichage du Dashboard
      description: |
        Lecture groupée des personnalisations explicites. L’absence de ligne laisse
        Core UI résoudre le rendu automatique et les réglages historiques.
        Les réglages suivent les droits de lecture de l’équipement et de la commande.
      parameters:
        - $ref: '#/components/parameters/DisplayContext'
        - $ref: '#/components/parameters/DisplayContextId'
      responses:
        '200':
          description: Réglages accessibles à l’utilisateur.
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Display' }
                  total: { type: integer, minimum: 0 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /display/eqLogics/{id}:
    parameters:
      - $ref: '#/components/parameters/EqLogicId'
      - $ref: '#/components/parameters/DisplayContext'
      - $ref: '#/components/parameters/DisplayContextId'
    put:
      tags: [Affichage]
      operationId: replaceEqLogicDisplay
      summary: Enregistrer l’affichage d’une tuile du Dashboard
      description: |
        Réservé aux administrateurs. Remplace ensemble les personnalisations de la
        tuile et de ses commandes. Pour conserver les réglages des commandes en
        changeant le rendu de la tuile, les inclure dans le corps.
        La visibilité générale d’une commande reste prioritaire. Dans un ordre
        personnalisé, les commandes sans position suivent les commandes ordonnées
        et conservent entre elles leur ordre habituel.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EqLogicDisplayWrite' }
      responses:
        '204': { description: Réglages enregistrés. }
        '400':
          description: Corps JSON invalide.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413':
          description: Le corps de la requête dépasse 1 Mio.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Affichage]
      operationId: resetEqLogicDisplay
      summary: Réinitialiser l’affichage d’une tuile du Dashboard
      description: Réservé aux administrateurs. Retire les réglages de la tuile et de ses commandes.
      responses:
        '204': { description: Affichage automatique rétabli. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /cmds:
    get:
      tags: [Commandes]
      operationId: listCmds
      summary: Lister les commandes
      description: |
        Remplace les ajax `byEqLogic` et les JSON-RPC `cmd::all`,
        `cmd::byEqLogicId`. Une commande est lisible si l'utilisateur a le
        droit de lecture (info) ou d'exécution (action) sur son équipement ;
        les autres sont retirées de la liste, et de `total`. Triées par
        `order`, puis par nom, puis par `id`. `total` compte les commandes
        qui correspondent aux filtres et à `q`, avant `limit` et `offset`.
      parameters:
        - name: eqLogicId
          in: query
          description: Ne garder que les commandes de cet équipement.
          schema: { type: integer, minimum: 1 }
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/CmdType' }
        - name: subType
          in: query
          schema: { $ref: '#/components/schemas/CmdSubType' }
        - name: generic_type
          in: query
          description: Ne garder que les commandes de ce type générique (ex. `LIGHT_STATE`).
          schema: { type: string }
        - name: isHistorized
          in: query
          schema: { type: boolean }
        - name: q
          in: query
          description: |
            Recherche libre. Chaque mot doit se retrouver dans au moins un de
            ces champs : nom de la commande, nom de l'équipement, type
            générique. Sans tenir compte des majuscules ni des accents.
          schema: { type: string, maxLength: 200, example: temperature }
        - $ref: '#/components/parameters/ListLimit'
        - $ref: '#/components/parameters/ListOffset'
      responses:
        '200':
          description: Liste des commandes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CmdList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Commandes]
      operationId: createCmd
      summary: Créer une commande
      description: |
        Remplace l'ajax `save` et le JSON-RPC `cmd::save` sans `id`.
        Réservé aux administrateurs ayant le droit d'écriture sur
        l'équipement.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CmdCreate' }
      responses:
        '201':
          description: Commande créée.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cmd' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/CmdConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
    patch:
      tags: [Commandes]
      operationId: updateCmds
      summary: Modifier plusieurs commandes
      description: |
        Remplace les ajax `setIsVisibles` et `multiSave` (l'ajax
        `setIsVisibles` actuel ne vérifie aucun droit). Applique les mêmes
        changements à chaque commande ; une commande qui échoue n'arrête pas
        les autres. Réservé aux administrateurs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, changes]
              properties:
                ids: { $ref: '#/components/schemas/EqLogicIds' }
                changes:
                  type: object
                  minProperties: 1
                  properties:
                    isVisible: { type: boolean }
                    isHistorized: { type: boolean }
                    generic_type: { type: [string, 'null'], maxLength: 255 }
            example: { ids: [101, 102], changes: { isVisible: false } }
      responses:
        '200':
          description: Résultat pour chaque commande.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /cmds/order:
    put:
      tags: [Commandes]
      operationId: reorderCmds
      summary: Réordonner des commandes
      description: |
        Remplace l'ajax `setOrder`, en ne changeant que l'ordre (l'ajax
        actuel ne vérifie aucun droit et modifie aussi la disposition de
        l'équipement). Les commandes prennent les positions 1, 2, 3… dans
        l'ordre donné ; les identifiants inconnus sont ignorés. Réservé aux
        administrateurs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  items: { type: integer }
                  example: [101, 103, 102]
      responses:
        '204': { description: Ordre enregistré. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /cmds/{id}:
    parameters:
      - $ref: '#/components/parameters/CmdId'
    get:
      tags: [Commandes]
      operationId: getCmd
      summary: Lire une commande
      description: |
        Remplace les ajax `byId`, `getCmd` et le JSON-RPC `cmd::byId`.
        Une commande non lisible renvoie 403.
      responses:
        '200':
          description: La commande.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cmd' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/CmdNotFound' }
    patch:
      tags: [Commandes]
      operationId: updateCmd
      summary: Modifier une commande
      description: |
        Remplace les ajax `save` et le JSON-RPC `cmd::save` avec `id`. Seuls
        les champs envoyés sont modifiés ; `configuration`, `display`,
        `template` et `alert` sont fusionnés clé par clé. Réservé aux
        administrateurs ayant le droit d'écriture sur l'équipement.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CmdUpdate' }
      responses:
        '200':
          description: Commande modifiée.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cmd' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/CmdNotFound' }
        '409': { $ref: '#/components/responses/CmdConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Commandes]
      operationId: deleteCmd
      summary: Supprimer une commande
      description: |
        Supprime la commande, son historique et ses caches (`cmd::remove`).
        Les scénarios qui la référencent ne sont pas modifiés : consulter
        `/cmds/{id}/usages` avant. Réservé aux administrateurs ayant le droit
        d'écriture sur l'équipement.
      responses:
        '204': { description: Commande supprimée. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/CmdNotFound' }

  /cmds/{id}/exec:
    parameters:
      - $ref: '#/components/parameters/CmdId'
    post:
      tags: [Commandes]
      operationId: execCmd
      summary: Exécuter une commande action
      description: |
        Remplace l'ajax `execCmd` et le JSON-RPC `cmd::execCmd` pour une
        commande action. Demande le droit d'exécution sur l'équipement.
        L'utilisateur inscrit dans les journaux est celui du jeton ou de la
        session, jamais une valeur envoyée par le client. Une commande info
        renvoie 422 : sa valeur se lit avec `/cmds/{id}/value`.
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CmdExecRequest' }
            example: { options: { slider: 40 } }
      responses:
        '200':
          description: Commande exécutée.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    description: Valeur renvoyée par le plugin, souvent `null`.
                    type: [string, number, boolean, 'null']
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: |
            Droit d'exécution manquant (`code: forbidden`), code d'accès absent ou faux
            (`code: access_code_required`), ou confirmation absente
            (`code: confirmation_required`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/CmdNotFound' }
        '409':
          description: 'Équipement désactivé, ou échec renvoyé par le plugin (`code: cmd_exec_failed`).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /cmds/{id}/value:
    parameters:
      - $ref: '#/components/parameters/CmdId'
    get:
      tags: [Commandes]
      operationId: getCmdValue
      summary: Lire la valeur d'une commande
      description: |
        Remplace l'ajax `execCmd` et le JSON-RPC `cmd::execCmd` sur une
        commande info (valeur du cache, sans interroger l'appareil). Pour
        une commande action, renvoie la dernière valeur envoyée
        (`lastCmdValue`). Demande le droit de lecture.
      responses:
        '200':
          description: Valeur courante.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CmdValue' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/CmdNotFound' }

  /cmds/{id}/history:
    parameters:
      - $ref: '#/components/parameters/CmdId'
    get:
      tags: [Commandes]
      operationId: getCmdHistory
      summary: Lire l'historique d'une commande info
      description: |
        Remplace l'ajax `getHistory` (identifiant numérique seulement) et le
        JSON-RPC `cmd::getHistory`. Les courbes calculées à partir d'une
        formule ne sont pas reprises ici. Demande le droit de lecture.
      parameters:
        - $ref: '#/components/parameters/HistoryStart'
        - $ref: '#/components/parameters/HistoryEnd'
        - name: grouping
          in: query
          description: |
            Regroupement `fonction::période` du core (`history::all`), ex.
            `avg::hour`, `max::day`.
          schema:
            type: string
            pattern: '^(avg|max|high|min|low|sum)::(minute|hour|day|week|month|year)$'
            example: avg::hour
      responses:
        '200':
          description: Points d'historique, du plus ancien au plus récent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CmdHistory' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/CmdNotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /cmds/{id}/statistics:
    parameters:
      - $ref: '#/components/parameters/CmdId'
    get:
      tags: [Commandes]
      operationId: getCmdStatistics
      summary: Statistiques d'une commande info
      description: |
        Remplace les JSON-RPC `cmd::getStatistique` et `cmd::getTendance`.
        Demande le droit de lecture. Une commande action renvoie 422.
      parameters:
        - $ref: '#/components/parameters/HistoryStart'
        - $ref: '#/components/parameters/HistoryEnd'
      responses:
        '200':
          description: Statistiques sur la période.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CmdStatistics' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/CmdNotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /cmds/{id}/usages:
    parameters:
      - $ref: '#/components/parameters/CmdId'
    get:
      tags: [Commandes]
      operationId: listCmdUsages
      summary: Lister ce qui utilise une commande
      description: |
        Remplace l'ajax `usedBy`. À consulter avant une suppression.
        Réservé aux administrateurs.
      responses:
        '200':
          description: Utilisations, par type d'élément.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EqLogicUsages' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/CmdNotFound' }

  /events:
    get:
      tags: [Temps réel]
      operationId: streamEvents
      summary: Suivre les événements en direct (SSE)
      description: |
        Flux `text/event-stream` qui remplace le polling de l'ajax
        `event.ajax.php` (`event::changes`, 59 s d'attente). Core UI ouvre
        le flux avec le cookie de session sur la même origine. Un client hors
        navigateur passe `Authorization: Bearer`. Le jeton n'est jamais accepté dans l'URL.

        **Format.** Un événement de la table `event` porte `id` (curseur,
        le `datetime` de la ligne), `event` (type, ex. `cmd::update`) et
        `data` (JSON, schéma `Event`). Un bloc `id` sans événement fournit le
        curseur dès l'ouverture. Après 15 s sans événement, un commentaire
        `: ping` maintient la connexion ouverte et un champ `id` indique
        jusqu'où le serveur a lu la table.

        **Droits.** Chaque événement est filtré avant envoi selon
        l'utilisateur : un événement sur un élément qu'il ne peut pas lire
        n'est jamais envoyé. Les compteurs d'administration (`message::*`,
        `update::*`) sont réservés aux administrateurs.

        **Reprise.** Le client renvoie le dernier curseur reçu dans l'en-tête
        `Last-Event-ID` : le flux reprend juste après. Le core ne garde que
        les 250 derniers événements et seulement le dernier état par
        commande ou équipement ; si le curseur est trop ancien, le flux
        commence par un événement `resync` et l'UI recharge l'état par les
        routes REST.

        **Durée.** Le serveur ferme la connexion au bout de `maxDuration`
        secondes (300 s par défaut) en ayant envoyé `retry: 1000` ;
        le client se reconnecte avec le dernier curseur reçu. Un processus
        PHP reste occupé pendant la connexion, comme aujourd'hui avec le long
        polling.

        **Limites.** Pour économiser les processus Apache : la nouvelle UI
        partage un flux par session entre ses onglets. Un onglet visible
        porte la connexion et passe le relais en se masquant ou en se
        fermant. Si aucun onglet abonné n'est visible, le flux est fermé.
        La reprise utilise le dernier curseur partagé. Le serveur accepte
        au plus 3 connexions simultanées par utilisateur ; au-delà,
        429 `too_many_streams`.
      parameters:
        - name: X-CSRF-Token
          in: header
          description: |
            Jeton de la session connue de Core UI. S'il est envoyé pour une
            session par cookie et que le navigateur a changé de session
            dans un autre onglet, la route renvoie 401 `session_expired`.
          schema: { type: string }
        - name: Last-Event-ID
          in: header
          description: Dernier curseur reçu, envoyé par le client à la reconnexion.
          schema: { type: string, example: '1730899200.1234' }
        - name: since
          in: query
          description: |
            Curseur de départ pour la première connexion (`EventSource` ne
            permet pas d'en-tête). Ignoré si `Last-Event-ID` est présent. Sans
            les deux, le flux commence à l'instant de la connexion.
          schema: { type: string, example: '1730899200.1234' }
        - name: types
          in: query
          description: Types d'événements à recevoir (tous par défaut).
          style: form
          explode: false
          schema:
            type: array
            items: { $ref: '#/components/schemas/EventType' }
        - name: objectId
          in: query
          description: Ne garder que les événements des objets indiqués (et de leurs équipements et commandes).
          style: form
          explode: false
          schema: { type: array, items: { type: integer } }
        - name: eqLogicId
          in: query
          description: Ne garder que les événements des équipements indiqués (et de leurs commandes).
          style: form
          explode: false
          schema: { type: array, items: { type: integer } }
        - name: cmdId
          in: query
          description: Ne garder que les événements des commandes indiquées.
          style: form
          explode: false
          schema: { type: array, items: { type: integer } }
        - name: scenarioId
          in: query
          description: Ne garder que les événements des scénarios indiqués.
          style: form
          explode: false
          schema: { type: array, items: { type: integer } }
        - name: maxDuration
          in: query
          description: Durée maximale de la connexion, en secondes.
          schema: { type: integer, minimum: 5, maximum: 300, default: 300 }
      responses:
        '200':
          description: |
            Flux d'événements, envoyé au fil de l'eau (`Cache-Control: no-cache`,
            pas de compression).
            Les filtres se cumulent (ET entre familles, OU dans une liste) ;
            les événements globaux (`jeedom::alert`, `notify`…) ne sont pas
            filtrés par `objectId`/`eqLogicId`/`cmdId`/`scenarioId`.
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  Messages SSE dont le champ `data` suit le schéma `Event`
                  (`itemSchema` d'OpenAPI 3.2, non disponible en 3.1).
                contentSchema: { $ref: '#/components/schemas/Event' }
              example: |
                retry: 1000

                id: 1730899200.1230

                id: 1730899200.1234
                event: cmd::update
                data: {"type":"cmd::update","data":{"cmd_id":12,"value":"21.5","display_value":"21.5","unit":"°C","raw_unit":"°C","valueDate":"2026-11-06 14:00:00","collectDate":"2026-11-06 14:00:00"}}

                : ping
                id: 1730899200.1234
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429':
          description: Trop de connexions ouvertes pour cet utilisateur (`too_many_streams`).
          headers:
            Retry-After:
              description: Délai conseillé avant de réessayer, en secondes.
              schema: { type: integer, example: 10 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /scenarios:
    get:
      tags: [Scénarios]
      operationId: listScenarios
      summary: Lister les scénarios
      description: |
        Remplace les ajax `all` et `allOrderedByGroupObjectName`, et le
        JSON-RPC `scenario::all`. Les scénarios que l'utilisateur n'a pas le
        droit de lire sont retirés. Sans le contenu (blocs) : il se lit avec
        `GET /scenarios/{id}?include=elements`. Triés par groupe, `order`,
        nom, puis `id` (ordre stable). `total` compte les scénarios qui
        correspondent aux filtres et à `q`, avant `limit` et `offset`.
      parameters:
        - name: group
          in: query
          description: Ne garder que ce groupe. Chaîne vide pour les scénarios sans groupe.
          schema: { type: string }
        - name: objectId
          in: query
          schema: { type: integer, minimum: 1 }
        - name: active
          in: query
          schema: { type: boolean }
        - name: visible
          in: query
          schema: { type: boolean }
        - name: q
          in: query
          description: |
            Recherche libre. Chaque mot doit se retrouver dans au moins un de
            ces champs : nom, groupe, nom de l'objet, description. Sans tenir
            compte des majuscules ni des accents.
          schema: { type: string, maxLength: 200, example: chauffage nuit }
        - $ref: '#/components/parameters/ListLimit'
        - $ref: '#/components/parameters/ListOffset'
      responses:
        '200':
          description: Liste des scénarios.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScenarioList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Scénarios]
      operationId: createScenario
      summary: Créer un scénario
      description: |
        Remplace l'ajax `save` et le JSON-RPC `scenario::save` sans `id`.
        Réservé aux administrateurs : un scénario peut contenir des blocs
        `code` (PHP exécuté par le serveur).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScenarioCreate' }
      responses:
        '201':
          description: Scénario créé, avec son contenu.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Scenario' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    patch:
      tags: [Scénarios]
      operationId: updateScenarios
      summary: Modifier plusieurs scénarios
      description: |
        Active, désactive, montre, cache ou regroupe plusieurs scénarios.
        Un scénario qui échoue n'arrête pas les autres. Réservé aux
        administrateurs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, changes]
              properties:
                ids: { $ref: '#/components/schemas/EqLogicIds' }
                changes:
                  type: object
                  minProperties: 1
                  properties:
                    isActive: { type: boolean }
                    isVisible: { type: boolean }
                    group: { type: [string, 'null'], maxLength: 127 }
            example: { ids: [3, 8], changes: { isActive: false } }
      responses:
        '200':
          description: Résultat pour chaque scénario.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /scenarios/delete:
    post:
      tags: [Scénarios]
      operationId: deleteScenarios
      summary: Supprimer plusieurs scénarios
      description: |
        Chaque scénario est supprimé comme avec `DELETE /scenarios/{id}`.
        Route en `POST`, comme `/eqLogics/delete`. Réservé aux
        administrateurs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids: { $ref: '#/components/schemas/EqLogicIds' }
      responses:
        '200':
          description: Résultat pour chaque scénario.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /scenarios/order:
    put:
      tags: [Scénarios]
      operationId: reorderScenarios
      summary: Réordonner des scénarios
      description: |
        Remplace l'ajax `setOrder`, en ne changeant que l'ordre (l'ajax
        actuel ne vérifie aucun droit et modifie aussi l'affichage).
        Positions 1, 2, 3… dans l'ordre donné ; identifiants inconnus
        ignorés. Réservé aux administrateurs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids: { type: array, items: { type: integer }, example: [8, 3] }
      responses:
        '204': { description: Ordre enregistré. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /scenarios/groups:
    get:
      tags: [Scénarios]
      operationId: listScenarioGroups
      summary: Lister les groupes de scénarios
      description: |
        Remplace l'ajax `autoCompleteGroup` : noms de groupes existants parmi
        les scénarios lisibles, triés.
      responses:
        '200':
          description: Groupes.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { type: string }, example: [Chauffage, Lumières] }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /scenarios/{id}:
    parameters:
      - $ref: '#/components/parameters/ScenarioId'
    get:
      tags: [Scénarios]
      operationId: getScenario
      summary: Lire un scénario
      description: |
        Remplace les ajax `byId`, `get` et le JSON-RPC `scenario::byId`.
        Les modèles (templates), l'export/import et le test d'expression
        viendront dans une version suivante.
        Avec `include=elements`, ajoute son contenu (blocs), réservé aux
        administrateurs (403 sinon). Un scénario non lisible renvoie 403.
      parameters:
        - name: include
          in: query
          schema:
            type: array
            items: { type: string, enum: [elements] }
          style: form
          explode: false
      responses:
        '200':
          description: Le scénario.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Scenario' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ScenarioNotFound' }
    patch:
      tags: [Scénarios]
      operationId: updateScenario
      summary: Modifier un scénario
      description: |
        Remplace l'ajax `save` avec `id`. Seuls les champs envoyés sont
        modifiés ; `configuration` et `display` sont fusionnés clé par clé.
        `elements`, s'il est envoyé, remplace tout le contenu du scénario
        (les blocs absents sont supprimés). Si le scénario est en cours
        d'exécution, il est d'abord arrêté, puis mis à jour. Réservé aux
        administrateurs ayant le droit d'écriture.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScenarioUpdate' }
      responses:
        '200':
          description: Scénario modifié, avec son contenu.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Scenario' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ScenarioNotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Scénarios]
      operationId: deleteScenario
      summary: Supprimer un scénario
      description: |
        Remplace l'ajax `remove`. Supprime aussi son contenu, son journal et
        ses données de vues, et l'inscrit dans l'historique des
        suppressions. Les éléments qui l'appellent ne sont pas modifiés :
        consulter `/scenarios/{id}/usages` avant. Réservé aux administrateurs
        ayant le droit d'écriture.
      responses:
        '204': { description: Scénario supprimé. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ScenarioNotFound' }

  /scenarios/{id}/copy:
    parameters:
      - $ref: '#/components/parameters/ScenarioId'
    post:
      tags: [Scénarios]
      operationId: copyScenario
      summary: Dupliquer un scénario
      description: Remplace l'ajax `copy`. La copie reprend tout le contenu, sous le nom donné. Réservé aux administrateurs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 127 }
      responses:
        '201':
          description: Copie créée.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Scenario' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ScenarioNotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /scenarios/{id}/start:
    parameters:
      - $ref: '#/components/parameters/ScenarioId'
    post:
      tags: [Scénarios]
      operationId: startScenario
      summary: Lancer un scénario
      description: |
        Remplace `changeState` (start), le JSON-RPC `scenario::changeState` et
        l'API HTTP `type=scenario`. Demande le droit d'exécution. Les tags
        sont transmis au scénario (`#nom#`) ; `trigger` vaut toujours `user`
        et `user_login` l'utilisateur du jeton. Lancement en arrière-plan :
        la réponse n'attend pas la fin. Un scénario désactivé renvoie 409.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                tags:
                  type: object
                  description: Tags du scénario, sans les dièses.
                  additionalProperties: { type: string }
                  example: { piece: salon }
      responses:
        '202':
          description: Lancement demandé.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScenarioRunState' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ScenarioNotFound' }
        '409':
          description: |
            Lancement impossible : scénario désactivé (`code: scenario_disabled`),
            moteur de scénarios désactivé dans la configuration
            (`code: scenario_engine_disabled`), ou scénario déjà en cours sans
            exécutions multiples (`code: scenario_running`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /scenarios/{id}/stop:
    parameters:
      - $ref: '#/components/parameters/ScenarioId'
    post:
      tags: [Scénarios]
      operationId: stopScenario
      summary: Arrêter un scénario
      description: Remplace `changeState` (stop). Arrête l'exécution en cours et les blocs « dans » / « à » programmés. Demande le droit d'exécution.
      responses:
        '200':
          description: Scénario arrêté.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScenarioRunState' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ScenarioNotFound' }

  /scenarios/{id}/log:
    parameters:
      - $ref: '#/components/parameters/ScenarioId'
    get:
      tags: [Scénarios]
      operationId: getScenarioLog
      summary: Lire le journal d'exécution
      description: |
        Remplace la lecture de `scenarioLog/scenario<id>` par l'ajax `log`.
        Les dernières lignes, de la plus ancienne à la plus récente.
        Réservé aux administrateurs : le journal contient les valeurs et le
        résultat des blocs `code`.

        Pour suivre le journal en direct, l'écran rappelle la route toutes
        les 1 à 2 s tant qu'il est ouvert, avec l'`offset` reçu à l'appel
        précédent. Ce n'est pas lié à l'état du scénario : on lit le fichier
        même si le scénario n'est pas vu comme actif. Le core n'écrit le
        journal au fil de l'eau qu'en mode `realtime` (`logmode`) ; en mode
        `default`, les lignes arrivent à la fin de l'exécution.
      parameters:
        - name: lines
          in: query
          description: Sans `offset`, nombre de dernières lignes à renvoyer.
          schema: { type: integer, minimum: 1, maximum: 5000, default: 500 }
        - name: offset
          in: query
          description: |
            Position en octets d'où reprendre la lecture (`offset` de la
            réponse précédente). Si le fichier a été vidé ou recréé (offset
            plus grand que sa taille), la lecture repart du début et `reset`
            vaut `true`. Au plus 1 Mo est lu par appel, et seulement des
            lignes complètes : la suite vient à l'appel suivant.
          schema: { type: integer, minimum: 0 }
      responses:
        '200':
          description: Lignes lues et position où reprendre.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScenarioLog' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ScenarioNotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Scénarios]
      operationId: emptyScenarioLog
      summary: Vider le journal d'exécution
      description: Remplace l'ajax `emptyLog`. Réservé aux administrateurs.
      responses:
        '204': { description: Journal vidé. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ScenarioNotFound' }

  /scenarios/{id}/usages:
    parameters:
      - $ref: '#/components/parameters/ScenarioId'
    get:
      tags: [Scénarios]
      operationId: listScenarioUsages
      summary: Lister ce qui utilise un scénario
      description: Remplace `getUsedBy` (ajax `get`). À consulter avant une suppression. Réservé aux administrateurs.
      responses:
        '200':
          description: Utilisations, par type d'élément.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EqLogicUsages' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ScenarioNotFound' }

  /config:
    get:
      tags: [Configuration]
      operationId: getConfig
      summary: Lire des clés de configuration du core
      description: |
        Renvoie les clés demandées dans `keys` ; sans `keys`, toutes les clés
        exposées. Une clé hors de la liste exposée refuse la requête (422).
        Une clé chiffrée est absente de la réponse pour un non-administrateur.
      parameters:
        - name: keys
          in: query
          required: false
          description: 'Noms de clés séparés par des virgules (ex. `name,language,timezone`).'
          schema: { type: string }
      responses:
        '200':
          description: Valeurs des clés demandées.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigValues' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
    patch:
      tags: [Configuration]
      operationId: updateConfig
      summary: Modifier des clés de configuration (administrateur)
      description: |
        Seules les clés envoyées sont enregistrées (`config::save`). Une clé
        inconnue ou d'un mauvais type refuse toute la requête (422), rien
        n'est enregistré. Renvoie les clés envoyées, relues.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfigValuesUpdate' }
      responses:
        '200':
          description: Clés envoyées, après enregistrement.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigValues' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Jeton lié à un utilisateur (ou à un utilisateur technique pour un démon de plugin).
    sessionCookie:
      type: apiKey
      in: cookie
      name: JeedomSession
      description: |
        Session de la nouvelle UI, ouverte par `POST /session` (cookie
        `__Host-JeedomSession` en HTTPS). Les requêtes d'écriture exigent
        l'en-tête `X-CSRF-Token`.

  headers:
    SystemFileETag:
      description: ETag fort du contenu du fichier.
      schema: { type: string, pattern: '^"[a-f0-9]{64}"$' }
  parameters:
    SystemFileRoot:
      name: root
      in: query
      required: true
      description: Identifiant renvoyé par la liste des racines.
      schema: { type: string, pattern: '^[a-z-]{1,32}$' }
    BackupId:
      name: id
      in: path
      required: true
      description: Identifiant opaque fourni par la liste des sauvegardes.
      schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,340}$' }
    BackupRepositoryId:
      name: repositoryId
      in: path
      required: true
      description: Identifiant fourni par la liste des dépôts de sauvegarde.
      schema: { type: string }
    csrfToken:
      name: X-CSRF-Token
      in: header
      description: Obligatoire sur les écritures authentifiées par session.
      schema: { type: string }
    PluginId:
      name: id
      in: path
      required: true
      schema: {type: string, pattern: '^[A-Za-z0-9_][A-Za-z0-9_-]{0,126}$'}
    ObjectId:
      name: id
      in: path
      required: true
      description: Identifiant de l'objet.
      schema: { type: integer, minimum: 1 }
    SummaryKey:
      name: key
      in: path
      required: true
      description: Clé de résumé définie dans la configuration (ex. `temperature`, `light`).
      schema: { type: string, example: temperature }
    SummaryKeyQuery:
      name: key
      in: query
      description: Limiter le résultat à une clé de résumé.
      schema: { type: string, example: temperature }

    ListLimit:
      name: limit
      in: query
      description: Nombre maximal d'éléments renvoyés. Sans ce paramètre, tous les éléments sont renvoyés.
      schema: { type: integer, minimum: 1, maximum: 500, example: 50 }
    ListOffset:
      name: offset
      in: query
      description: Nombre d'éléments à sauter, à combiner avec `limit`.
      schema: { type: integer, minimum: 0, default: 0 }

    DisplayContext:
      name: context
      in: query
      description: Contexte d’affichage. Cette API prend en charge le Dashboard.
      schema: { type: string, const: dashboard, default: dashboard }
    DisplayContextId:
      name: context_id
      in: query
      description: Identifiant de contexte réservé au Dashboard.
      schema: { type: integer, const: 0, default: 0 }

    EqLogicId:
      name: id
      in: path
      required: true
      description: Identifiant de l'équipement.
      schema: { type: integer, minimum: 1 }
    EqLogicInclude:
      name: include
      in: query
      description: Données liées à inclure.
      schema:
        type: array
        items: { type: string, enum: [cmds] }
      style: form
      explode: false

    CmdId:
      name: id
      in: path
      required: true
      description: Identifiant de la commande.
      schema: { type: integer, minimum: 1 }
    HistoryStart:
      name: start
      in: query
      description: Début de la période (ISO 8601). Par défaut, 24 heures avant `end`.
      schema: { type: string, format: date-time, example: '2026-11-04T00:00:00+01:00' }
    HistoryEnd:
      name: end
      in: query
      description: Fin de la période (ISO 8601). Par défaut, maintenant.
      schema: { type: string, format: date-time }

    ScenarioId:
      name: id
      in: path
      required: true
      description: Identifiant du scénario.
      schema: { type: integer, minimum: 1 }
    UserId:
      name: id
      in: path
      required: true
      description: Identifiant de l'utilisateur.
      schema: { type: integer, minimum: 1 }
    DeviceKey:
      name: key
      in: path
      required: true
      description: Identifiant de la session longue, lu dans la liste des appareils.
      schema: { type: string, pattern: '^[0-9a-f]{64}$' }
    SessionId:
      name: sessionId
      in: path
      required: true
      description: Identifiant public de la session, lu dans la liste des sessions.
      schema: { type: string, pattern: '^[0-9a-f]{64}$' }

  schemas:
    Backup:
      type: object
      additionalProperties: false
      required: [id, name, size, modifiedAt]
      properties:
        id: { type: string, description: Identifiant opaque de la sauvegarde. }
        name: { type: string, description: Nom du fichier. }
        size: { type: [integer, 'null'], minimum: 0, description: Taille en octets. }
        modifiedAt: { type: [string, 'null'], format: date-time, description: Dernière modification du fichier. }
    BackupList:
      type: object
      additionalProperties: false
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Backup' }
        total: { type: integer, minimum: 0 }
    BackupReferenceList:
      type: object
      additionalProperties: false
      required: [items, total]
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, name]
            properties:
              id: { type: string }
              name: { type: string }
        total: { type: integer, minimum: 0 }
    RemoteBackupList:
      type: object
      additionalProperties: false
      required: [items, total]
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, name, size]
            properties:
              id: { type: string }
              name: { type: string }
              size:
                type: [integer, 'null']
                minimum: 0
                description: Taille en octets du fichier distant (chiffré pour Jeedom Cloud), ou null si inconnue.
        total: { type: integer, minimum: 0 }
    SystemInfo:
      type: object
      required: [version, hardware, started]
      properties:
        version: { type: string }
        hardware: { type: string }
        started: { type: boolean }
    SystemHealth:
      type: object
      required: [items, total, phpExtensions, checkedAt]
      properties:
        items:
          type: array
          items:
            type: object
            required: [key, name, state, result, comment]
            properties:
              key: { type: string }
              name: { type: string }
              state:
                enum: [true, false, 2]
              result: { type: [string, number] }
              comment: { type: string }
        total: { type: integer, minimum: 0 }
        phpExtensions:
          type: array
          items: { type: string }
        checkedAt: { type: string, format: date-time }
    SystemBenchmark:
      type: object
      required: [durations]
      properties:
        durations:
          type: object
          description: Mesures natives du benchmark et durée totale sous la clé total, en secondes.
          required: [total]
          properties:
            total: { type: number, minimum: 0 }
          additionalProperties: { type: number, minimum: 0 }
    SystemMaintenanceAccepted:
      type: object
      required: [log]
      properties:
        log:
          type: string
          enum: [consistency, cleaningdb]
    SystemDatabaseSchema:
      type: object
      required: [tables]
      properties:
        tables:
          type: object
          additionalProperties:
            type: object
            required: [status, sql]
            properties:
              status: { type: string, enum: [ok, nok] }
              sql: { type: string }
    SystemSqlResult:
      type: object
      required: [columns, rows, affectedRows, durationMs]
      properties:
        columns:
          type: array
          items: { type: string }
        rows:
          type: array
          items:
            type: array
            items: { type: [string, number, boolean, 'null'] }
        affectedRows: { type: [integer, 'null'], minimum: 0 }
        durationMs: { type: number, minimum: 0 }
    SystemShellResult:
      type: object
      required: [output, exitCode]
      properties:
        output: { type: string, description: Sorties standard et d’erreur combinées. }
        exitCode: { type: integer }
    SystemFileRoots:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, path, readable, writable]
            properties:
              id: { type: string }
              path: { type: string, description: Chemin relatif à Jeedom. }
              readable: { type: boolean }
              writable: { type: boolean, description: Le répertoire racine est accessible en écriture. }
        total: { type: integer, minimum: 0 }
    SystemFileEntries:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            type: object
            required: [name, path, type, writable]
            properties:
              name: { type: string }
              path: { type: string, description: Chemin relatif à la racine. }
              type: { type: string, enum: [directory, file] }
              writable: { type: boolean, description: Le fichier est éligible à l’enregistrement. }
        total: { type: integer, minimum: 0, maximum: 1000 }
    SystemFileContent:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content: { type: string, maxLength: 1048576, description: Contenu UTF-8 du fichier limité à 1 Mio. }
    BackupAccepted:
      type: object
      additionalProperties: false
      required: [log]
      properties:
        log:
          type: string
          enum: [backup, restore]
          description: Nom du journal à lire via GET /logs/{name}. Les lignes `[PROGRESS][n]` indiquent le pourcentage par étape.
    LogList:
      type: object
      required:
      - items
      - total
      properties:
        items:
          type: array
          items:
            type: string
        total:
          type: integer
          minimum: 0
    LogPage:
      type: object
      required:
      - name
      - start
      - lines
      - nextStart
      properties:
        name:
          type: string
        start:
          type: integer
          minimum: 0
        lines:
          type: array
          items:
            type: string
        nextStart:
          type:
          - integer
          - 'null'
          minimum: 0
          description: Début de la page suivante, null en fin de fichier.
    LogRemoval:
      type: object
      required:
      - removed
      properties:
        removed:
          type: boolean
    LogRemovalResult:
      type: object
      required:
      - removed
      - retained
      properties:
        removed:
          type: array
          items:
            type: string
        retained:
          type: array
          items:
            type: string

    Cron:
      type: object
      required:
      - class
      - function
      - schedule
      - enable
      - deamon
      - once
      - timeout
      - deamonSleepTime
      - id
      - state
      - lastRun
      - pid
      - runtime
      - option
      properties:
        class:
          type: string
          maxLength: 127
          default: ''
          description: Classe PHP, vide pour une fonction globale.
        function:
          type: string
          minLength: 1
          maxLength: 127
        schedule:
          type: string
          minLength: 1
          maxLength: 127
          example: '*/5 * * * *'
          description: Nouvelle expression validée avec checkAndFixCron et CronExpression. Une programmation existante inchangée est conservée.
        enable:
          type: boolean
          default: true
        deamon:
          type: boolean
          default: false
        once:
          type: boolean
          default: false
        timeout:
          type: integer
          minimum: 0
          maximum: 2147483647
          default: 0
          description: Durée maximale en minutes. 0 conserve le réglage global.
        deamonSleepTime:
          type: integer
          minimum: 0
          maximum: 2147483647
          default: 0
          description: Pause du démon en secondes. 0 conserve le réglage global.
        id:
          type: integer
          minimum: 1
          readOnly: true
        state:
          type: string
          readOnly: true
          description: 'État natif : run, stop, starting, stoping, error…'
        lastRun:
          type:
          - string
          - 'null'
          readOnly: true
          description: Heure locale du serveur YYYY-MM-DD HH:mm:ss, sans conversion de fuseau.
        pid:
          type:
          - integer
          - 'null'
          readOnly: true
        runtime:
          type:
          - number
          - 'null'
          readOnly: true
          description: Dernière durée en secondes.
        option:
          readOnly: true
          description: Options existantes retournées pour inspection et conservées lors des modifications.
    CronCreate:
      type: object
      additionalProperties: false
      required:
      - function
      - schedule
      properties:
        class:
          type: string
          maxLength: 127
          default: ''
          description: Classe PHP, vide pour une fonction globale.
        function:
          type: string
          minLength: 1
          maxLength: 127
        schedule:
          type: string
          minLength: 1
          maxLength: 127
          example: '*/5 * * * *'
          description: Nouvelle expression validée avec checkAndFixCron et CronExpression. Une programmation existante inchangée est conservée.
        enable:
          type: boolean
          default: true
        deamon:
          type: boolean
          default: false
        once:
          type: boolean
          default: false
        timeout:
          type: integer
          minimum: 0
          maximum: 2147483647
          default: 0
          description: Durée maximale en minutes. 0 conserve le réglage global.
        deamonSleepTime:
          type: integer
          minimum: 0
          maximum: 2147483647
          default: 0
          description: Pause du démon en secondes. 0 conserve le réglage global.
    CronUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        class:
          type: string
          maxLength: 127
          description: Classe PHP, vide pour une fonction globale.
        function:
          type: string
          minLength: 1
          maxLength: 127
        schedule:
          type: string
          minLength: 1
          maxLength: 127
          example: '*/5 * * * *'
          description: Nouvelle expression validée avec checkAndFixCron et CronExpression. Une programmation existante inchangée est conservée.
        enable:
          type: boolean
        deamon:
          type: boolean
        once:
          type: boolean
        timeout:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: Durée maximale en minutes. 0 conserve le réglage global.
        deamonSleepTime:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: Pause du démon en secondes. 0 conserve le réglage global.
    Variable:
      type: object
      required: [id, key, value, scenarioId]
      properties:
        id: { type: integer, example: 12 }
        key: { type: string, example: presence }
        value:
          type: string
          description: Valeur enregistrée, telle quelle (un tableau stocké est rendu en JSON).
          example: '1'
        scenarioId:
          type: [integer, 'null']
          description: Scénario propriétaire ; nul pour une variable globale.
    VariableCreate:
      type: object
      additionalProperties: false
      required: [key, value]
      properties:
        key: { type: string, minLength: 1, maxLength: 127 }
        value: { type: string }
    VariableUpdate:
      type: object
      additionalProperties: false
      required: [value]
      properties:
        value: { type: string }
    VariableList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Variable'
        total:
          type: integer
          minimum: 0
    CronList:
      type: object
      required:
      - items
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Cron'
        total:
          type: integer
          minimum: 0

    Message:
      type: object
      required:
      - id
      - date
      - plugin
      - logicalId
      - message
      - action
      - occurrences
      properties:
        id:
          type: integer
        date:
          type: string
          description: Date du dernier envoi, `AAAA-MM-JJ HH:MM:SS` (heure de la box).
        plugin:
          type: string
          description: Émetteur du message (identifiant de plugin ou `core`).
        logicalId:
          type: string
        message:
          type: string
          description: Fragment HTML assaini (`<i>`, `<a href>` http(s) ou relatif).
        action:
          type: string
          description: Fragment HTML assaini, comme `message`.
        occurrences:
          type: integer
          minimum: 1
          description: Nombre d'envois identiques regroupés (1 si le message n'a été envoyé qu'une fois).
    MessageList:
      type: object
      required:
      - items
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        total:
          type: integer
          minimum: 0
    MessageCount:
      type: object
      required:
      - count
      properties:
        count:
          type: integer
          minimum: 0

    Scenario:
      type: object
      required: [id, name, group, isActive, isVisible, mode, order, state]
      properties:
        id: { type: integer, example: 3 }
        name: { type: string, maxLength: 127, example: Réveil }
        group: { type: [string, 'null'], maxLength: 127, example: Chauffage }
        isActive: { type: boolean }
        isVisible: { type: boolean }
        mode:
          type: string
          enum: [provoke, schedule, all]
          description: '`provoke` : sur événement, `schedule` : programmé, `all` : les deux.'
        schedule:
          type: array
          description: Programmations au format cron.
          items: { type: string, example: '0 7 * * 1-5' }
        trigger:
          type: array
          description: 'Déclencheurs, au format lisible (`#[Salon][Porte][Etat]#`, `#start#`…).'
          items: { type: string }
        timeout: { type: [integer, 'null'], description: Délai maximal d'exécution en secondes. }
        object_id: { type: [integer, 'null'] }
        order: { type: integer }
        description: { type: [string, 'null'] }
        display: { type: object, additionalProperties: true }
        configuration:
          type: object
          description: |
            Réglages (`allowMultiInstance`, `syncmode`, `logmode`,
            `timeDependency`, `has_return`…).
          additionalProperties: true
        state:
          readOnly: true
          type: string
          enum: [stop, in progress, starting, error]
        lastLaunch: { type: [string, 'null'], readOnly: true, example: '2026-11-06 07:00:00' }
        elements:
          type: array
          description: Présent seulement avec `include=elements` (administrateurs), et après une création ou une modification.
          items: { $ref: '#/components/schemas/ScenarioElement' }

    ScenarioCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 127 }
        group: { type: [string, 'null'], maxLength: 127 }
        isActive: { type: boolean, default: true }
        isVisible: { type: boolean, default: true }
        mode: { type: string, enum: [provoke, schedule, all], default: provoke }
        schedule: { type: array, items: { type: string } }
        trigger: { type: array, items: { type: string } }
        timeout: { type: [integer, 'null'], minimum: 0 }
        object_id: { type: [integer, 'null'] }
        order: { type: integer }
        description: { type: [string, 'null'] }
        display: { type: object, additionalProperties: true }
        configuration: { type: object, additionalProperties: true }
        elements: { type: array, items: { $ref: '#/components/schemas/ScenarioElement' } }

    ScenarioUpdate:
      type: object
      minProperties: 1
      description: Les mêmes champs qu'à la création, tous facultatifs.
      properties:
        name: { type: string, minLength: 1, maxLength: 127 }
        group: { type: [string, 'null'], maxLength: 127 }
        isActive: { type: boolean }
        isVisible: { type: boolean }
        mode: { type: string, enum: [provoke, schedule, all] }
        schedule: { type: array, items: { type: string } }
        trigger: { type: array, items: { type: string } }
        timeout: { type: [integer, 'null'], minimum: 0 }
        object_id: { type: [integer, 'null'] }
        order: { type: integer }
        description: { type: [string, 'null'] }
        display: { type: object, additionalProperties: true }
        configuration: { type: object, additionalProperties: true }
        elements: { type: array, items: { $ref: '#/components/schemas/ScenarioElement' } }

    ScenarioList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Scenario' }
        total: { type: integer, example: 14 }

    ScenarioRunState:
      type: object
      required: [state]
      properties:
        state: { type: string, enum: [stop, in progress, starting, error] }
        lastLaunch: { type: [string, 'null'] }

    ScenarioElement:
      type: object
      description: |
        Bloc du scénario (si, action, code, pour, dans, à…), au format de
        `scenarioElement::getAjaxElement`. `id` est absent à la création
        d'un bloc.
      required: [type, subElements]
      properties:
        id: { type: integer }
        type:
          type: string
          description: 'Type de bloc connu du core : `if`, `action`, `code`, `for`, `while`, `in`, `at`, `comment`.'
          example: if
        name: { type: [string, 'null'] }
        options: { type: object, additionalProperties: true }
        subElements:
          type: array
          items: { $ref: '#/components/schemas/ScenarioSubElement' }

    ScenarioSubElement:
      type: object
      required: [type, subtype, expressions]
      properties:
        id: { type: integer }
        type:
          type: string
          description: 'Partie du bloc : `if`, `then`, `else`, `action`, `code`, `for`, `do`, `in`, `at`, `comment`.'
          example: then
        subtype: { type: string, enum: [condition, action] }
        name: { type: [string, 'null'] }
        options: { type: object, additionalProperties: true }
        expressions:
          type: array
          items: { $ref: '#/components/schemas/ScenarioExpression' }

    ScenarioExpression:
      type: object
      required: [type, expression]
      properties:
        id: { type: integer }
        type:
          type: string
          enum: [condition, action, code, element]
          description: '`code` : PHP exécuté par le serveur. `element` : bloc imbriqué, dans `element`.'
        subtype: { type: [string, 'null'] }
        expression:
          type: string
          description: Condition, commande ou action au format lisible (`#[Salon][Lampe][On]#`).
        options: { type: object, additionalProperties: true }
        element: { $ref: '#/components/schemas/ScenarioElement' }

    Plugin:
      type: object
      required: [id, name, category, isEnable, hasEqLogic, icon, uiModule]
      properties:
        id: { type: string, description: Identifiant du plugin (aussi `eqType_name` de ses équipements)., example: zwavejs }
        name: { type: string, description: Nom traduit dans la langue de l'utilisateur., example: Z-Wave JS }
        category: { type: string, description: 'Catégorie du market (ex. `automation protocol`).', example: automation protocol }
        isEnable: { type: boolean, example: true }
        hasEqLogic:
          type: boolean
          description: Le plugin gère des équipements (sa classe hérite d'`eqLogic`).
        icon:
          type: [string, 'null']
          description: URL relative de l'icône du plugin.
          example: plugins/zwavejs/plugin_info/zwavejs_icon.png
        uiModule:
          type: [string, 'null']
          description: |
            URL relative du module de la nouvelle UI fourni par le plugin,
            (`plugins/<id>/ui/ui.js`, à part des pages desktop et mobile), `null`
            s'il n'en a pas. Toujours `null` pour un plugin désactivé.
          example: plugins/zwavejs/ui/ui.js
        version: { type: [string, 'null'], description: Version installée. }
        management: { $ref: '#/components/schemas/PluginManagement' }

    PluginRepository:
      type: object
      required: [id, name, fields]
      properties:
        id: { type: string, enum: [market, github, url, file, samba] }
        name: { type: string }
        fields:
          type: array
          items:
            type: object
            required: [id, name, type, required, default]
            properties:
              id: { type: string }
              name: { type: string }
              type: { type: string, enum: [text, password, file] }
              required: { type: boolean }
              default: { type: string }

    PluginArchive:
      type: object
      required: [id, pluginId, name, size]
      properties:
        id: { type: string }
        pluginId: { type: string }
        name: { type: string }
        size: { type: integer }

    PluginManagement:
      type: object
      required: [source, branch, updatedAt, hasOwnDaemon, daemonState]
      properties:
        source: { type: [string, 'null'] }
        branch: { type: [string, 'null'] }
        updatedAt: { type: [string, 'null'] }
        hasOwnDaemon: { type: boolean }
        daemonState: { type: [string, 'null'] }
        updatesBlocked: { type: boolean, description: Les mises à jour et réinstallations sont bloquées par la configuration du plugin. }
        update:
          oneOf:
            - $ref: '#/components/schemas/ComponentUpdate'
            - type: 'null'

    ComponentUpdate:
      type: object
      required: [id, status, localVersion, remoteVersion, updatable]
      properties:
        id: { type: integer }
        status: { type: string, description: 'État natif, notamment update, ok ou hold.' }
        localVersion: { type: [string, 'null'] }
        remoteVersion: { type: [string, 'null'] }
        updatable: { type: boolean, description: Une mise à jour est disponible et autorisée. }
        reinstallable: { type: boolean, description: Une réinstallation est autorisée depuis la source configurée. }

    CoreComponent:
      type: object
      required: [name, version, source, branch, update]
      properties:
        name: { type: string }
        version: { type: string }
        source: { type: string }
        branch: { type: string }
        update:
          oneOf:
            - $ref: '#/components/schemas/ComponentUpdate'
            - type: 'null'

    PluginManagementPage:
      type: object
      required: [items, total, core, lastCheck, operation]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Plugin' } }
        total: { type: integer }
        core: { $ref: '#/components/schemas/CoreComponent' }
        lastCheck: { type: [string, 'null'] }
        operation:
          oneOf:
            - $ref: '#/components/schemas/UpdateOperation'
            - type: 'null'

    UpdateOperation:
      type: object
      required: [id, kind, state, items, createdAt, startedAt, finishedAt, error, progress, logName]
      properties:
        id: { type: string }
        kind: { type: string, enum: [check, update] }
        state: { type: string, enum: [queued, running, succeeded, failed] }
        createdAt: { type: string }
        startedAt: { type: [string, 'null'] }
        finishedAt: { type: [string, 'null'] }
        error: { type: [string, 'null'] }
        logName: { type: string, enum: [update] }
        progress:
          type: [integer, 'null']
          minimum: 0
          maximum: 100
          description: Jalons natifs du script du Core, uniquement pendant cette étape. Aucun pourcentage inventé pour les plugins ou pour l’ensemble du lot.
        items:
          type: array
          items:
            type: object
            required: [id, type, logicalId, name, state, error]
            properties:
              id: { type: integer }
              type: { type: string, enum: [core, plugin] }
              logicalId: { type: string }
              name: { type: string }
              state: { type: string, enum: [queued, running, succeeded, failed, skipped] }
              error: { type: [string, 'null'] }

    PluginDetails:
      allOf:
      - $ref: '#/components/schemas/Plugin'
      - type: object
        properties:
          description:
            type: string
          author:
            type: string
          license:
            type: string
          minJeedomVersion:
            type: string
          minOsVersion:
            type: string
          compatible:
            type: boolean
          configurationPath:
            type:
            - string
            - 'null'
          hasDependency:
            type: boolean
          hasOwnDaemon:
            type: boolean
          usedSpace:
            type:
            - integer
            - 'null'
          installation:
            type: string
          links:
            type: object
            properties:
              documentation:
                type:
                - string
                - 'null'
              changelog:
                type:
                - string
                - 'null'
              issue:
                type:
                - string
                - 'null'
              market:
                type: [string, 'null']
            required:
            - documentation
            - changelog
            - issue
          functionality:
            type: object
            additionalProperties:
              type: object
              properties:
                exists:
                  type: boolean
                controllable:
                  type: boolean
                enabled:
                  type: boolean
              required:
              - exists
              - controllable
              - enabled
          logs:
            type: array
            items:
              type: string
          logLevel:
            type: string
            enum:
            - default
            - debug
            - info
            - warning
            - error
            - none
          heartbeatDelay:
            type: integer
            minimum: 0
          heartbeatRestartDaemon:
            type: boolean
          update:
            oneOf:
            - type: object
              properties:
                id:
                  type: integer
                source:
                  type: string
                branch:
                  type: string
                status:
                  type: string
                localVersion:
                  type:
                  - string
                  - 'null'
                remoteVersion:
                  type:
                  - string
                  - 'null'
                updatedAt:
                  type:
                  - string
                  - 'null'
              required:
              - id
              - source
              - branch
              - status
              - localVersion
              - remoteVersion
              - updatedAt
            - type: 'null'
        required:
        - description
        - author
        - license
        - minJeedomVersion
        - minOsVersion
        - compatible
        - configurationPath
        - hasDependency
        - hasOwnDaemon
        - usedSpace
        - installation
        - links
        - functionality
        - logs
        - logLevel
        - heartbeatDelay
        - heartbeatRestartDaemon
        - update
    PluginPatch:
      type: object
      properties:
        isEnable:
          type: boolean
        updatesBlocked:
          type: boolean
          description: Bloquer ou débloquer les mises à jour et réinstallations du plugin.
        functionality:
          type: object
          additionalProperties:
            type: boolean
        logLevel:
          type: string
          enum:
          - default
          - debug
          - info
          - warning
          - error
          - none
        heartbeatDelay:
          type: integer
          minimum: 0
          maximum: 2147483647
        heartbeatRestartDaemon:
          type: boolean
      additionalProperties: false
      minProperties: 1
    PluginDependencies:
      type: object
      properties:
        state:
          type: string
        auto:
          type: boolean
        log:
          type:
          - string
          - 'null'
        progression:
          type:
          - number
          - 'null'
        duration:
          type:
          - number
          - 'null'
        lastLaunch:
          type:
          - string
          - 'null'
      required:
      - state
      - auto
      - log
      - progression
      - duration
      - lastLaunch
    PluginDaemon:
      type: object
      properties:
        state:
          type: string
        launchable:
          type: string
        launchableMessage:
          type: string
        auto:
          type: boolean
        log:
          type:
          - string
          - 'null'
        lastLaunch:
          type:
          - string
          - 'null'
      required:
      - state
      - launchable
      - launchableMessage
      - auto
      - log
      - lastLaunch
    PluginInstallationPreview:
      type: object
      properties:
        marketId:
          type: integer
        pluginId:
          type: string
        name:
          type: string
        version:
          type: string
          enum:
          - stable
          - beta
        publishedAt:
          type:
          - string
          - 'null'
        minJeedomVersion:
          type:
          - string
          - 'null'
        installed:
          type: boolean
        isEnable:
          type: boolean
        installedVersion:
          type:
          - string
          - 'null'
        box:
          type: object
          properties:
            name:
              type: string
            version:
              type: string
          required:
          - name
          - version
      required:
      - marketId
      - pluginId
      - name
      - version
      - publishedAt
      - minJeedomVersion
      - installed
      - isEnable
      - installedVersion
      - box
    PluginInstallation:
      type: object
      properties:
        id:
          type: string
        pluginId:
          type: string
        source:
          type: string
          description: Source d’installation directe ; absente pour une installation Market.
        marketId:
          type: [integer, 'null']
        version:
          type: [string, 'null']
          description: Branche Market ou GitHub, null pour les sources sans branche.
        state:
          type: string
          enum:
          - queued
          - running
          - succeeded
          - failed
        createdAt:
          type: string
        startedAt:
          type:
          - string
          - 'null'
        finishedAt:
          type:
          - string
          - 'null'
        error:
          oneOf:
          - type: object
            properties:
              code:
                type: string
              message:
                type: string
            required:
            - code
            - message
          - type: 'null'
      required:
      - id
      - pluginId
      - marketId
      - version
      - state
      - createdAt
      - startedAt
      - finishedAt
      - error

    PluginList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Plugin' }
        total: { type: integer, example: 12 }

    Me:
      type: object
      required: [id, login, isAdmin]
      properties:
        id: { type: integer, example: 1 }
        login: { type: string, example: admin }
        isAdmin: { type: boolean, description: Profil administrateur., example: true }
        profils: { $ref: '#/components/schemas/UserProfile' }
        preferences: { $ref: '#/components/schemas/MePreferences' }
        csrfToken:
          type: [string, 'null']
          description: |
            Jeton à renvoyer dans l'en-tête `X-CSRF-Token` des écritures en
            session (relu ici au rechargement de la page). `null` avec un
            jeton `Bearer`.

    UserProfile:
      type: string
      enum: [admin, user, restrict]
      description: |
        `admin` : tous les droits. `user` : lecture et commandes, sans
        administration. `restrict` : seulement les éléments autorisés dans
        `/users/{id}/rights`.

    UserKind:
      type: string
      enum: [human, system, plugin]
      description: |
        Nature du compte. `human` : compte de connexion classique.
        `system` : comptes créés par le core (`internal_report`,
        `jeedom_support`), non modifiables. `plugin` : réservé aux futurs
        comptes techniques des démons de plugins (sans connexion, droits
        limités au plugin). Ils sont listés dans `/users` ; aucun n'existe
        encore dans le core.

    User:
      type: object
      description: |
        Utilisateur vu par un administrateur. Jamais renvoyés : `password`,
        `hash`, et tout ce qui touche à la double authentification
        (`twoFactorAuthentification`, son secret), ni les `session_id` des
        appareils.
      required: [id, login, profils, enable, kind]
      properties:
        id: { type: integer, readOnly: true, example: 2 }
        login: { type: string, example: marie }
        profils: { $ref: '#/components/schemas/UserProfile' }
        enable: { type: boolean, example: true }
        kind: { $ref: '#/components/schemas/UserKind' }
        twoFactorEnabled:
          type: boolean
          readOnly: true
          description: Double authentification activée (indicateur seul, ni code ni secret).
        lastConnection:
          type: [string, 'null']
          format: date-time
          readOnly: true
          description: Dernière connexion (`options.lastConnection`).
        options: { $ref: '#/components/schemas/UserAdminOptions' }
      example:
        id: 2
        login: marie
        profils: user
        enable: true
        kind: human
        twoFactorEnabled: false
        lastConnection: '2026-11-06T18:42:00+01:00'
        options: { localOnly: 0, 'api::mode': disable, doNotRotateHash: 0 }

    UserAdminOptions:
      type: object
      description: Options réglées par un administrateur (sous-ensemble de `options` du core).
      properties:
        localOnly: { type: integer, enum: [0, 1], description: Connexion autorisée seulement depuis le réseau local. }
        'api::mode':
          type: string
          enum: [enable, whiteip, localhost, disable]
          description: Accès à l'API avec le jeton de cet utilisateur.
        doNotRotateHash: { type: integer, enum: [0, 1], description: Ne pas régénérer automatiquement le jeton tous les 3 mois. }

    NewPassword:
      type: string
      format: password
      writeOnly: true
      minLength: 8
      pattern: '^(?=.*[A-Za-z])(?=.*[0-9])'
      description: |
        Nouveau mot de passe : 8 caractères au moins, avec au moins une
        lettre et un chiffre, et différent de l'identifiant (sans tenir
        compte des majuscules). Sinon 422 `weak_password`. La règle
        s'applique à la création d'un compte et à chaque changement de mot
        de passe ; les mots de passe existants restent valides.

    UserCreate:
      type: object
      additionalProperties: false
      required: [login, password]
      properties:
        login: { type: string, minLength: 1, maxLength: 255, example: marie }
        password: { $ref: '#/components/schemas/NewPassword' }

    UserUpdate:
      type: object
      additionalProperties: false
      description: Liste blanche des champs modifiables par un administrateur.
      properties:
        login: { type: string, minLength: 1, maxLength: 255 }
        password: { $ref: '#/components/schemas/NewPassword' }
        profils: { $ref: '#/components/schemas/UserProfile' }
        enable: { type: boolean }
        options: { $ref: '#/components/schemas/UserAdminOptions' }

    UserList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/User' }
        total: { type: integer, example: 3 }

    UserRightValue:
      type: string
      enum: [n, r, rx]
      description: '`n` aucun accès, `r` lecture, `rx` lecture et exécution (commandes, lancement).'

    UserRights:
      type: object
      description: |
        Droits par élément. Clé = type d'élément suivi de son identifiant
        (`eqLogic12`, `jeeObject3`, `scenario5`, `view1`, `plan2`,
        `plan3d1`) ou `menu::<page>` pour les pages de l'interface.
      propertyNames:
        pattern: '^((eqLogic|jeeObject|scenario|view|plan|plan3d)[0-9]+|menu::[A-Za-z0-9_]+)$'
      additionalProperties: { $ref: '#/components/schemas/UserRightValue' }
      example: { eqLogic12: rx, jeeObject3: r, scenario5: n }

    MePreferences:
      type: object
      additionalProperties: false
      description: |
        Préférences de l'utilisateur (sous-ensemble de `options` du core).
        Les clés `plugin::<id>::<clé>` des plugins sont refusées pour
        l'instant : elles seront déclarées par chaque plugin.
      properties:
        homePage: { type: string, example: 'core::dashboard', description: Page d'accueil sur ordinateur. }
        homePageMobile: { type: string }
        defaultDashboardObject: { type: [integer, 'null'], description: Objet affiché par défaut sur le dashboard. }
        defaultMobileObject: { type: [integer, 'null'] }
        defaultDesktopView: { type: [integer, 'null'] }
        defaultMobileView: { type: [integer, 'null'] }
        defaultDashboardPlan: { type: [integer, 'null'] }
        defaultMobilePlan: { type: [integer, 'null'] }
        defaultDashboardPlan3d: { type: [integer, 'null'] }
        defaultMobilePlan3d: { type: [integer, 'null'] }
        defaultPlanFullScreen: { type: integer, enum: [0, 1] }
        defaultPlan3dFullScreen: { type: integer, enum: [0, 1] }
        displayViewByDefault: { type: integer, enum: [0, 1] }
        'notification::cmd':
          type: string
          description: Commande de notification, au format `#[Objet][Équipement][Commande]#`.
          example: '#[Maison][Téléphone][Notification]#'

    ApiToken:
      type: object
      required: [token, generatedAt]
      properties:
        token: { type: string, description: Jeton API (`hash` du core)., example: 'aBcD…' }
        generatedAt:
          type: [string, 'null']
          format: date-time
          description: Date de création du jeton (`options.hashGenerated`).

    MeUpdate:
      type: object
      additionalProperties: false
      dependentRequired:
        password: [currentPassword]
      properties:
        currentPassword: { type: string, format: password, minLength: 1, writeOnly: true, description: 'Mot de passe actuel, obligatoire avec `password`.' }
        password: { $ref: '#/components/schemas/NewPassword' }
        preferences: { $ref: '#/components/schemas/MePreferences' }

    Device:
      type: object
      required: [key, datetime, ip]
      properties:
        key: { type: string, description: Identifiant public de la session longue. }
        datetime: { type: string, format: date-time, description: Dernière utilisation. }
        expiresAt: { type: string, format: date-time, description: Expiration de la session longue. }
        ip: { type: string, example: 192.168.1.20 }
        current: { type: boolean, description: Appareil de la requête en cours. }

    DeviceList:
      type: object
      required: [items, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Device' } }
        total: { type: integer }

    SessionInfo:
      type: object
      required: [id, ip, datetime, current]
      properties:
        id: { type: string, pattern: '^[0-9a-f]{64}$', description: Identifiant public de la session. }
        ip: { type: string }
        datetime: { type: string, format: date-time, description: Dernière activité. }
        expiresAt: { type: string, format: date-time, description: Expiration de la session. }
        current: { type: boolean, description: Session de la requête en cours. }

    SessionInfoList:
      type: object
      required: [items, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/SessionInfo' } }
        total: { type: integer }

    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login: { type: string, minLength: 1, example: admin }
        password: { type: string, format: password, minLength: 1 }
        twoFactorCode:
          type: string
          description: Code de la double authentification, demandé hors du réseau local si l'utilisateur l'a activée.
          example: '123456'
        rememberDevice:
          type: boolean
          default: false
          description: Ouvre une session longue de 90 jours.

    Session:
      type: object
      required: [user, csrfToken]
      properties:
        user: { $ref: '#/components/schemas/Me' }
        csrfToken: { type: string, description: Jeton à renvoyer dans l'en-tête `X-CSRF-Token` des écritures. }

    CmdType:
      type: string
      enum: [info, action]
    CmdSubType:
      type: string
      description: 'info : numeric, binary, string. action : other, slider, message, color, select.'
      enum: [numeric, binary, string, other, slider, message, color, select]

    Cmd:
      type: object
      required: [id, eqLogic_id, name, type, subType, isVisible, isHistorized, order]
      properties:
        id: { type: integer, example: 101 }
        eqLogic_id: { type: integer, example: 12 }
        eqType: { type: string, description: Plugin de l'équipement., example: virtual }
        logicalId: { type: [string, 'null'] }
        name: { type: string, maxLength: 127, example: Etat }
        type: { $ref: '#/components/schemas/CmdType' }
        subType: { $ref: '#/components/schemas/CmdSubType' }
        generic_type: { type: [string, 'null'], example: LIGHT_STATE }
        order: { type: integer }
        isVisible: { type: boolean }
        isHistorized: { type: boolean, description: Toujours `false` pour une action. }
        unite: { type: [string, 'null'], maxLength: 45, example: '°C' }
        value:
          type: [string, 'null']
          description: Pour une action, la commande info liée (`#[Objet][Équipement][Commande]#`).
        configuration:
          type: object
          description: |
            Réglages de la commande (`minValue`, `maxValue`,
            `calculValueOffset`, `actionConfirm`, `actionCodeAccess`…) et clés
            propres au plugin. Le code d'accès (`actionCodeAccess`) n'est
            jamais renvoyé et ne se modifie pas par l'API (422).
          additionalProperties: true
        display: { type: object, additionalProperties: true }
        template:
          type: object
          additionalProperties: true
          example: { dashboard: 'core::default', mobile: 'core::default' }
        alert: { type: object, additionalProperties: true }
        currentValue:
          readOnly: true
          description: Valeur courante (info) ou dernière valeur envoyée (action), comme `cmd::exportApi`.
          type: [string, number, boolean, 'null']

    CmdCreate:
      type: object
      required: [eqLogic_id, name, type, subType]
      properties:
        eqLogic_id: { type: integer, minimum: 1 }
        name: { type: string, minLength: 1, maxLength: 127 }
        type: { $ref: '#/components/schemas/CmdType' }
        subType: { $ref: '#/components/schemas/CmdSubType' }
        logicalId: { type: [string, 'null'], maxLength: 1023 }
        generic_type: { type: [string, 'null'], maxLength: 255 }
        order: { type: integer }
        isVisible: { type: boolean, default: true }
        isHistorized: { type: boolean, default: false }
        unite: { type: [string, 'null'], maxLength: 45 }
        value: { type: [string, 'null'] }
        configuration: { type: object, additionalProperties: true }
        display: { type: object, additionalProperties: true }
        template: { type: object, additionalProperties: true }
        alert: { type: object, additionalProperties: true }

    CmdUpdate:
      type: object
      minProperties: 1
      description: |
        Les mêmes champs qu'à la création, tous facultatifs, sauf
        `eqLogic_id` et `type` qui ne peuvent pas changer.
      properties:
        name: { type: string, minLength: 1, maxLength: 127 }
        subType: { $ref: '#/components/schemas/CmdSubType' }
        logicalId: { type: [string, 'null'], maxLength: 1023 }
        generic_type: { type: [string, 'null'], maxLength: 255 }
        order: { type: integer }
        isVisible: { type: boolean }
        isHistorized: { type: boolean }
        unite: { type: [string, 'null'], maxLength: 45 }
        value: { type: [string, 'null'] }
        configuration: { type: object, additionalProperties: true }
        display: { type: object, additionalProperties: true }
        template: { type: object, additionalProperties: true }
        alert: { type: object, additionalProperties: true }

    CmdList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Cmd' }
        total: { type: integer, example: 6 }

    CmdExecRequest:
      type: object
      properties:
        options:
          type: object
          description: Options selon le sous-type.
          properties:
            slider: { type: number, description: Sous-type `slider`. }
            color: { type: string, description: 'Sous-type `color` (ex. `#ff0000`).' }
            select: { type: string, description: Sous-type `select`. }
            title: { type: string, description: Sous-type `message`. }
            message: { type: string, description: Sous-type `message`. }
        codeAccess:
          type: string
          description: Code d'accès, si la commande en demande un.
        confirm:
          type: boolean
          description: À `true` si la commande demande une confirmation.

    CmdValue:
      type: object
      required: [value]
      properties:
        value: { type: [string, number, boolean, 'null'], example: 21.5 }
        collectDate: { type: [string, 'null'], description: Dernière remontée., example: '2026-11-05 10:40:12' }
        valueDate: { type: [string, 'null'], description: Dernier changement de valeur. }

    CmdHistory:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [datetime, value]
            properties:
              datetime: { type: string, example: '2026-11-05 10:00:00' }
              value: { type: [number, string, 'null'], example: 21.5 }

    CmdStatistics:
      type: object
      properties:
        avg: { type: [number, 'null'] }
        min: { type: [number, 'null'] }
        max: { type: [number, 'null'] }
        sum: { type: [number, 'null'] }
        count: { type: integer }
        std: { type: [number, 'null'] }
        variance: { type: [number, 'null'] }
        last: { type: [number, string, 'null'] }
        trend:
          type: number
          description: Pente de la tendance (`cmd::getTendance`), positive si la valeur monte.

    Object:
      type: object
      required: [id, name, father_id, isVisible, position]
      properties:
        id: { type: integer, example: 3 }
        name: { type: string, maxLength: 127, example: Salon }
        father_id:
          type: [integer, 'null']
          description: Objet parent, `null` pour un objet racine.
          example: 1
        isVisible: { type: boolean, example: true }
        position:
          type: [integer, 'null']
          description: Rang parmi les objets, utilisé pour l'ordre d'affichage.
          example: 2
        configuration: { $ref: '#/components/schemas/ObjectConfiguration' }
        display: { $ref: '#/components/schemas/ObjectDisplay' }
        image: { $ref: '#/components/schemas/ObjectImage' }
        eqLogics:
          type: array
          description: Présent seulement avec `include=eqLogics`.
          items: { $ref: '#/components/schemas/EqLogicWithCmds' }

    ObjectCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 127 }
        father_id: { type: [integer, 'null'] }
        isVisible: { type: boolean, default: true }
        position: { type: [integer, 'null'] }
        configuration: { $ref: '#/components/schemas/ObjectConfiguration' }
        display: { $ref: '#/components/schemas/ObjectDisplay' }

    ObjectUpdate:
      type: object
      minProperties: 1
      description: |
        Les mêmes champs qu'à la création, tous facultatifs. Un `father_id`
        égal à l'objet lui-même, ou créant un cycle, est refusé (422).
      properties:
        name: { type: string, minLength: 1, maxLength: 127 }
        father_id: { type: [integer, 'null'] }
        isVisible: { type: boolean }
        position: { type: [integer, 'null'] }
        configuration: { $ref: '#/components/schemas/ObjectConfiguration' }
        display: { $ref: '#/components/schemas/ObjectDisplay' }

    ObjectList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Object' }
        total: { type: integer, example: 8 }

    ObjectConfiguration:
      type: object
      description: |
        Réglages libres de l'objet. Clés connues du core : résumés (`summary`,
        `summary::hide::*`, `summary::global::*`), couleurs (`useCustomColor`,
        `tagColor`, `tagTextColor`, `mobile::summaryTextColor`),
        `hideOnDashboard`, `orderEqLogicByUsage::auto`, `parentNumber`
        (calculé). Les plugins peuvent ajouter leurs propres clés.
      additionalProperties: true
      properties:
        hideOnDashboard: { type: [integer, string] }
        useCustomColor: { type: [integer, string] }
        tagColor: { type: string, example: '#4a90e2' }
        tagTextColor: { type: string, example: '#ffffff' }
        summary:
          type: object
          description: Commandes qui alimentent chaque clé de résumé.
          additionalProperties: true
        parentNumber:
          type: integer
          readOnly: true
          description: Profondeur dans l'arbre, calculée par le core.

    ObjectDisplay:
      type: object
      additionalProperties: true
      properties:
        icon:
          type: string
          description: Icône au format HTML du core (ex. `<i class="icon jeedom-salon"></i>`).
        tagColor: { type: string }
        tagTextColor: { type: string }

    ObjectImage:
      type: object
      readOnly: true
      description: Métadonnées de l'image ; le fichier se gère via `/objects/{id}/image`.
      properties:
        type: { type: string, example: png }
        sha512: { type: string }

    EqLogicRef:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
        eqType_name: { type: string, description: Plugin de l'équipement, example: virtual }
        isEnable: { type: boolean }
        isVisible: { type: boolean }

    EqLogicWithCmds:
      allOf:
        - $ref: '#/components/schemas/EqLogicRef'
        - type: object
          properties:
            cmds:
              type: array
              description: Commandes de l'équipement que l'utilisateur peut lire, comme `GET /cmds?eqLogicId=`.
              items: { $ref: '#/components/schemas/Cmd' }

    SummaryResult:
      description: Une valeur seule (avec `key`) ou un dictionnaire clé de résumé → valeur.
      oneOf:
        - type: [number, string, 'null']
        - type: object
          additionalProperties: true

    DisplayTemplate:
      type: [string, 'null']
      minLength: 1
      maxLength: 127
      description: Clé stable du rendu, ou null pour le rendu automatique.
    DisplayParameters:
      type: object
      additionalProperties: true
      description: Paramètres du rendu.
    Display:
      type: object
      required: [id, target_type, target_id, context, context_id, template, template_parameters, sort_order, visible]
      properties:
        id: { type: integer, minimum: 1 }
        target_type: { type: string, enum: [eqLogic, cmd] }
        target_id: { type: integer, minimum: 1 }
        context: { type: string, const: dashboard }
        context_id: { type: integer, const: 0 }
        template: { $ref: '#/components/schemas/DisplayTemplate' }
        template_parameters: { $ref: '#/components/schemas/DisplayParameters' }
        sort_order: { type: [integer, 'null'], minimum: 0, maximum: 2147483647 }
        visible: { type: [boolean, 'null'] }
    EqLogicDisplayWrite:
      type: object
      additionalProperties: false
      required: [equipment, commands]
      properties:
        equipment:
          type: [object, 'null']
          additionalProperties: false
          properties:
            template: { $ref: '#/components/schemas/DisplayTemplate' }
            template_parameters: { $ref: '#/components/schemas/DisplayParameters' }
        commands:
          type: array
          maxItems: 1000
          description: Personnalisations des commandes de la tuile. Chaque identifiant ne peut être fourni qu’une fois.
          items:
            type: object
            additionalProperties: false
            required: [id]
            properties:
              id: { type: integer, minimum: 1, maximum: 2147483647 }
              template: { $ref: '#/components/schemas/DisplayTemplate' }
              template_parameters: { $ref: '#/components/schemas/DisplayParameters' }
              sort_order: { type: [integer, 'null'], minimum: 0, maximum: 2147483647 }
              visible: { type: [boolean, 'null'] }

    EqLogic:
      type: object
      required: [id, name, eqType_name, object_id, isEnable, isVisible, order]
      properties:
        id: { type: integer, example: 12 }
        name: { type: string, maxLength: 127, example: Lampe salon }
        eqType_name: { type: string, description: Plugin de l'équipement., example: virtual }
        logicalId:
          type: [string, 'null']
          description: Identifiant propre au plugin (adresse du module, etc.).
        object_id:
          type: [integer, 'null']
          description: Objet de l'équipement, `null` s'il n'en a pas.
          example: 3
        isEnable: { type: boolean, example: true }
        isVisible: { type: boolean, example: true }
        order: { type: integer, description: Rang d'affichage dans l'objet., example: 2 }
        timeout:
          type: [integer, 'null']
          description: Délai en minutes sans communication avant alerte, `null` si aucun.
        generic_type: { type: [string, 'null'], maxLength: 255 }
        tags:
          type: array
          description: Étiquettes libres (stockées dans le core séparées par des virgules).
          items: { type: string }
        comment: { type: [string, 'null'] }
        category: { $ref: '#/components/schemas/EqLogicCategory' }
        configuration: { $ref: '#/components/schemas/EqLogicConfiguration' }
        display:
          type: object
          description: Réglages d'affichage du widget, propres au core et aux plugins.
          additionalProperties: true
        status: { $ref: '#/components/schemas/EqLogicStatus' }
        image:
          type: [object, 'null']
          readOnly: true
          description: Métadonnées de l'image ; le fichier se gère via `/eqLogics/{id}/image`.
          properties:
            type: { type: string, example: png }
            sha512: { type: string }
        cmds:
          type: array
          description: |
            Présent seulement avec `include=cmds` : les commandes que
            l'utilisateur peut lire, comme `GET /cmds?eqLogicId=`.
          items: { $ref: '#/components/schemas/Cmd' }

    EqLogicCreate:
      type: object
      required: [name, eqType_name]
      properties:
        name: { type: string, minLength: 1, maxLength: 127 }
        eqType_name: { type: string, minLength: 1, maxLength: 127 }
        logicalId: { type: [string, 'null'], maxLength: 127 }
        object_id: { type: [integer, 'null'] }
        isEnable: { type: boolean, default: false }
        isVisible: { type: boolean, default: false }
        order: { type: integer }
        timeout: { type: [integer, 'null'], minimum: 1 }
        generic_type: { type: [string, 'null'], maxLength: 255 }
        tags: { type: array, items: { type: string } }
        comment: { type: [string, 'null'] }
        category: { $ref: '#/components/schemas/EqLogicCategory' }
        configuration: { $ref: '#/components/schemas/EqLogicConfiguration' }
        display: { type: object, additionalProperties: true }

    EqLogicUpdate:
      type: object
      minProperties: 1
      description: |
        Les mêmes champs qu'à la création, tous facultatifs, sauf
        `eqType_name` qui ne peut pas changer.
      properties:
        name: { type: string, minLength: 1, maxLength: 127 }
        logicalId: { type: [string, 'null'], maxLength: 127 }
        object_id: { type: [integer, 'null'] }
        isEnable: { type: boolean }
        isVisible: { type: boolean }
        order: { type: integer }
        timeout: { type: [integer, 'null'], minimum: 1 }
        generic_type: { type: [string, 'null'], maxLength: 255 }
        tags: { type: array, items: { type: string } }
        comment: { type: [string, 'null'] }
        category: { $ref: '#/components/schemas/EqLogicCategory' }
        configuration: { $ref: '#/components/schemas/EqLogicConfiguration' }
        display: { type: object, additionalProperties: true }

    EqLogicList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/EqLogic' }
        total: { type: integer, example: 24 }

    EqLogicCategory:
      type: object
      description: Catégories cochées. Aucune cochée équivaut à « autre ».
      properties:
        heating: { type: boolean }
        security: { type: boolean }
        energy: { type: boolean }
        light: { type: boolean }
        opening: { type: boolean }
        automatism: { type: boolean }
        multimedia: { type: boolean }
        default: { type: boolean }

    EqLogicConfiguration:
      type: object
      description: |
        Réglages de l'équipement, en grande partie propres au plugin.
        Renvoyés seulement aux administrateurs : les plugins y rangent
        parfois des identifiants ou des mots de passe. Clés connues du core :
        batterie (`battery_type`, `battery::disable`,
        `battery_warning_threshold`, `battery_danger_threshold`), `panelLink`,
        et les dates calculées `createtime`, `updatetime`, `batterytime`.
      additionalProperties: true
      properties:
        createtime: { type: string, readOnly: true, example: '2026-11-05 10:12:00' }
        updatetime: { type: string, readOnly: true }
        batterytime: { type: string, readOnly: true }

    EqLogicStatus:
      type: object
      readOnly: true
      description: |
        État d'exécution calculé par le core (en cache, pas en base) :
        dernière communication, batterie, alertes.
      additionalProperties: true
      properties:
        lastCommunication: { type: string, example: '2026-11-05 10:40:12' }
        battery: { type: [integer, 'null'], minimum: 0, maximum: 100 }
        timeout: { type: [integer, boolean] }
        warning: { type: [integer, boolean] }
        danger: { type: [integer, boolean] }

    EqLogicUsages:
      type: object
      required: [cmds, eqLogics, scenarios, plans, views, interactions, plugins]
      properties:
        cmds: { type: array, items: { $ref: '#/components/schemas/UsageRef' } }
        eqLogics: { type: array, items: { $ref: '#/components/schemas/UsageRef' } }
        scenarios: { type: array, items: { $ref: '#/components/schemas/UsageRef' } }
        plans: { type: array, items: { $ref: '#/components/schemas/UsageRef' } }
        views: { type: array, items: { $ref: '#/components/schemas/UsageRef' } }
        interactions: { type: array, items: { $ref: '#/components/schemas/UsageRef' } }
        plugins:
          type: object
          description: Par plugin, les éléments qui utilisent l'équipement.
          additionalProperties:
            type: array
            items: { $ref: '#/components/schemas/UsageRef' }

    UsageRef:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name:
          type: string
          description: 'Nom lisible (ex. `[Salon][Lampe][On]`).'

    EqLogicIds:
      type: array
      minItems: 1
      maxItems: 1000
      uniqueItems: true
      items: { type: integer, minimum: 1 }

    BulkResult:
      type: object
      required: [done, failed]
      description: Les éléments traités, et ceux qui ont échoué avec la raison.
      properties:
        done:
          type: array
          items: { type: integer }
          example: [12, 7]
        failed:
          type: array
          items:
            type: object
            required: [id, error]
            properties:
              id: { type: integer, example: 4 }
              error:
                type: object
                required: [code, message]
                properties:
                  code:
                    type: string
                    description: |
                      Même code que la route unitaire : `eqlogic_not_found`,
                      `forbidden`, `validation_error` (refus du plugin à
                      l'enregistrement, avec son message) ou
                      `eqlogic_remove_refused` (refus du plugin à la suppression).
                    example: forbidden
                  message: { type: string, example: Droits insuffisants. }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Code stable, utilisable par les clients.
              example: object_not_found
            message:
              type: string
              description: Message lisible, dans la langue de l'utilisateur.
              example: Objet inconnu.
            details:
              type: array
              description: Erreurs par champ, pour les erreurs de validation.
              items:
                type: object
                required: [field, message]
                properties:
                  field: { type: string, example: father_id }
                  message: { type: string, example: L'objet ne peut pas être son propre parent. }

    EventType:
      type: string
      description: |
        Types émis aujourd'hui par le core (`event::add`), tous exposés pour
        rester compatibles : `checkThemechange`, `changeTheme`,
        `jeedom::gotoplan` et `jeedom::coloredIcons` servent à l'ancienne UI
        et sont ignorés par la nouvelle.
      enum:
        - cmd::update
        - eqLogic::update
        - scenario::update
        - jeeObject::summary::update
        - message::refreshMessageNumber
        - update::refreshUpdateNumber
        - notify
        - jeedom::alert
        - jeedom::alertPopup
        - jeedom::gotoplan
        - jeedom::coloredIcons
        - checkThemechange
        - changeTheme
        - resync
    Event:
      type: object
      required: [type, data]
      description: Contenu du champ `data` d'un message SSE. `data` reprend tel quel le `option` de l'événement du core.
      properties:
        type: { $ref: '#/components/schemas/EventType' }
        data:
          description: Le schéma dépend de `type` (ex. `CmdUpdateEvent` pour `cmd::update`).
          anyOf:
            - $ref: '#/components/schemas/CmdUpdateEvent'
            - $ref: '#/components/schemas/EqLogicUpdateEvent'
            - $ref: '#/components/schemas/ScenarioUpdateEvent'
            - $ref: '#/components/schemas/SummaryUpdateEvent'
            - $ref: '#/components/schemas/NotifyEvent'
            - $ref: '#/components/schemas/ResyncEvent'
            - type: 'null'
              description: Événement sans contenu (compteurs à recharger).
            - type: [string, integer, object]
              description: Contenu libre des événements de l'ancienne UI (thème, plan, message d'alerte).
    CmdUpdateEvent:
      type: object
      required: [cmd_id, value]
      properties:
        cmd_id: { type: integer }
        value: { type: [string, number, 'null'], description: Tronquée à 3096 caractères. }
        display_value: { type: [string, number, 'null'] }
        unit: { type: string }
        raw_unit: { type: string }
        valueDate: { type: string }
        collectDate: { type: string }
    EqLogicUpdateEvent:
      type: object
      required: [eqLogic_id]
      properties:
        eqLogic_id: { type: integer }
        visible: { type: integer, enum: [0, 1] }
        enable: { type: integer, enum: [0, 1] }
    ScenarioUpdateEvent:
      type: object
      required: [scenario_id]
      properties:
        scenario_id: { type: integer }
        state: { type: string, enum: [stop, in progress, starting, error], example: in progress }
        lastLaunch: { type: [string, 'null'] }
        isActive: { type: integer, enum: [0, 1] }
        name: { type: string }
    SummaryUpdateEvent:
      type: object
      required: [object_id]
      properties:
        object_id: { type: [integer, string], description: "`global` pour le résumé général." }
        keys:
          type: object
          additionalProperties: true
    NotifyEvent:
      type: object
      properties:
        title: { type: string }
        message: { type: string }
        category: { type: string }
    ScenarioLog:
      type: object
      required: [lines, offset, reset]
      properties:
        lines:
          type: array
          items: { type: string }
          example: ['[2026-11-06 12:09:00][SCENARIO] Start : Scenario lance manuellement.']
        offset:
          type: integer
          description: Position à passer au prochain appel.
        reset:
          type: boolean
          description: Le fichier a été vidé ou recréé depuis l'offset demandé.
    ResyncEvent:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          enum: [cursor_too_old]
          description: Des événements ont pu être perdus ; recharger l'état par les routes REST.

    ConfigValues:
      type: object
      description: |
        Valeurs de configuration du core, indexées par nom de clé. Seules les
        clés demandées sont présentes ; une clé chiffrée est absente pour un
        non-administrateur. Le nom de l'onglet de l'administration est indiqué
        dans chaque description.
      additionalProperties: false
      properties:
        'object:summary': { $ref: '#/components/schemas/ConfigSummaries' }
        'name':
          type: string
          description: 'Utilisé notamment par le market (onglet general).'
        'display_name_login':
          type: boolean
          description: 'Afficher sur la page de connexion (onglet general).'
        'language':
          type: string
          description: 'Sélection de la langue d''affichage (onglet general).'
          default: 'fr_FR'
        'tts::engine':
          type: string
          description: 'Sélection du moteur text-to-speech (onglet general).'
        'timezone':
          type: string
          description: 'Sélection du fuseau horaire (onglet general).'
          default: 'Europe/Brussels'
        'ntp::optionalServer':
          type: string
          description: 'Permet d''ajouter un serveur de temps pour la synchronisation (onglet general).'
        'ignoreHourCheck':
          type: boolean
          description: 'Cochez la case pour ne pas prendre en compte l''heure du syst (onglet general).'
        'core::jqueryless':
          type: boolean
          description: 'Ne charge pas jQuery/Boostrap et leurs librairies (Attention (onglet general).'
          default: false
        'info::latitude':
          type: [number, 'null']
          description: 'Latitude (onglet general).'
        'info::longitude':
          type: [number, 'null']
          description: 'Longitude (onglet general).'
        'info::altitude':
          type: [number, 'null']
          description: 'Altitude du bâtiment en mètres (onglet general).'
        'jeedom_theme_main':
          type: string
          description: 'Principal (onglet interface).'
        'jeedom_theme_alternate':
          type: string
          description: 'Alternatif (onglet interface).'
          default: 'core2019_Dark'
        'mobile_theme_color':
          type: string
          description: 'Principal (onglet interface).'
          default: 'core2019_Light'
        'mobile_theme_color_night':
          type: string
          description: 'Alternatif (onglet interface).'
          default: 'core2019_Dark'
        'theme_changeAccordingTime':
          type: boolean
          description: 'Selon l''heure (onglet interface).'
          default: true
        'theme_start_day_hour':
          type: string
          description: 'Principal de (onglet interface).'
          default: '08:00'
        'theme_end_day_hour':
          type: string
          description: 'à (onglet interface).'
          default: '20:00'
        'mobile_theme_useAmbientLight':
          type: boolean
          description: 'Selon la luminosité (onglet interface).'
        'theme_displayAsTable':
          type: boolean
          description: 'Affichage tableau (onglet interface).'
          default: true
        'interface::advance::coloredIcons':
          type: boolean
          description: 'Icônes colorées (onglet interface).'
          default: true
