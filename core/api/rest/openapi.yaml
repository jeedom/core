      required: true
      schema:
        type: integer
        minimum: 1

  /messages:
    get:
      tags:
      - Messages
      operationId: listMessages
      summary: Lister les messages
      description: |
        Reprend l'action `all` de `core/ajax/message.ajax.php`, du plus récent
        au plus ancien. Sans `plugin`, le core renvoie au plus les 500 derniers
        messages (`message::all()`) ; avec `plugin`, tous ceux du plugin
        (`message::byPlugin()`). `message` et `action` sont rendus comme dans
        l'ancienne interface (`message::toArray()`), puis assainis par l'API :
        un fragment HTML où ne restent que `<i>` sans attribut et `<a>` avec,
        au plus, un `href` http(s) ou relatif. Les autres attributs
        (`onclick`, `style`…) et les liens `javascript:` sont retirés.
      parameters:
      - name: plugin
        in: query
        description: Ne garder que les messages de ce plugin (ou émetteur, ex. `core`).
        schema:
          type: string
          maxLength: 127
      - name: q
        in: query
        schema:
          type: string
          maxLength: 200
      - $ref: '#/components/parameters/ListLimit'
      - $ref: '#/components/parameters/ListOffset'
      responses:
        '200':
          description: Liste des messages.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags:
      - Messages
      operationId: clearMessages
      summary: Vider les messages (administrateur)
      description: |
        Reprend l'action `clearMessage` : supprime tous les messages, ou
        seulement ceux de `plugin`. Déclenche l'événement
        `message::refreshMessageNumber`.
      parameters:
      - name: plugin
        in: query
        schema:
          type: string
          maxLength: 127
      responses:
        '204':
          description: Messages supprimés.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /messages/count:
    get:
      tags:
      - Messages
      operationId: countMessages
      summary: Nombre de messages
      description: Reprend l'action `nbMessage` (`message::nbMessage()`), nombre total de messages ; le core n'a pas d'état lu ou non lu.
      responses:
        '200':
          description: Nombre de messages.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageCount'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /messages/{id}:
    delete:
      tags:
      - Messages
      operationId: deleteMessage
      summary: Supprimer un message (administrateur)
      description: Reprend l'action `removeMessage`. Déclenche l'événement `message::refreshMessageNumber`.
      responses:
        '204':
          description: Message supprimé.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Message inconnu (message_not_found).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  /plugins:
    get:
      tags: [Plugins]
      operationId: listPlugins
      summary: Lister les plugins installés
      description: |
        Remplace `plugin::listPlugin` (ajax et JSON-RPC `plugin::listPlugin`).
        Lisible par tout utilisateur connecté : la nouvelle UI s'en sert pour
        son menu et pour charger le module d'interface des plugins actifs.
        Triés par nom. `management=true` ajoute source, branche, date et état du démon, pour les administrateurs uniquement.
      parameters:
        - name: management
          in: query
          schema: { type: boolean, default: false }
        - name: enabled
          in: query
          description: Filtrer sur l'état activé. Sans ce paramètre, tous les plugins installés sont renvoyés.
          schema: { type: boolean }
      responses:
        '200':
          description: Liste des plugins.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginList' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /plugins/management:
    get:
      operationId: getPluginManagement
      summary: Inventaire installé avec le Core et les états de mise à jour connus.
      description: |
        Administrateur uniquement. L’inventaire des plugins installés fait référence : un plugin sans
        suivi de mise à jour reste présent, et une ancienne entrée sans plugin installé est ignorée.
        Le contrôleur assemble les informations avec les classes natives, sans accès SQL direct.
        Ce GET ne vérifie pas les dépôts et ne crée pas d’entrée de mise à jour.
      responses:
        '200':
          description: Core, plugins, date de vérification et dernière opération.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginManagementPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /updates/check:
    post:
      operationId: checkComponentUpdates
      summary: Planifier la vérification des mises à jour du Core et des plugins.
      description: Administrateur, CSRF en session et Idempotency-Key requis. Aucun paramètre. Aucun contrôle des paquets OS.
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{16,128}$' }
      responses:
        '202':
          description: Vérification planifiée ou en cours.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpdateOperation' }
        '200':
          description: Reprise idempotente d’une opération terminée.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpdateOperation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /updates/operations:
    post:
      operationId: startComponentUpdates
      summary: Planifier une ou plusieurs mises à jour, Core en premier.
      description: |
        Administrateur, CSRF en session et Idempotency-Key requis. Sélection explicite d’identifiants
        de la table update, limités aux plugins installés et au Core. Le worker revérifie les droits,
        les exclusions et les identités. Le Core passe avant les plugins, avec sauvegarde native.
        Un échec arrête la sélection restante. L’exécution indépendante survit à la fermeture du navigateur
        et au redémarrage de la queue par le Core. Une opération concurrente ou une installation de plugin
        donne 409. Une même clé avec une autre sélection ou un autre utilisateur donne 409.
        force permet de réinstaller la version de la source configurée sans mise à jour disponible.
        Les exclusions et les sources désactivées restent appliquées.
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{16,128}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ids]
              properties:
                ids:
                  type: array
                  minItems: 1
                  maxItems: 200
                  uniqueItems: true
                  items: { type: integer, minimum: 1 }
                force: { type: boolean, default: false }
      responses:
        '202':
          description: Mise à jour planifiée ou en cours.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpdateOperation' }
        '200':
          description: Reprise idempotente d’une opération terminée.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpdateOperation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /updates/operations/latest:
    get:
      operationId: getLatestComponentUpdate
      summary: Retrouver la dernière vérification ou mise à jour de la box.
      description: Administrateur uniquement. Ne démarre et ne rejoue aucune opération. Une tâche interrompue est signalée en échec.
      responses:
        '200':
          description: Dernière opération, ou null.
          content:
            application/json:
              schema:
                type: object
                required: [operation]
                properties:
                  operation:
                    oneOf:
                      - $ref: '#/components/schemas/UpdateOperation'
                      - type: 'null'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /plugins/repositories:
    get:
      tags: [Plugins]
      operationId: listPluginRepositories
      summary: Sources actives d’installation directe et leurs champs (administrateur)
      responses:
        '200':
          description: Dépôts autorisés pour les plugins, sans paramètres privés de la box.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PluginRepository' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /plugins/archives:
    post:
      tags: [Plugins]
      operationId: uploadPluginArchive
      summary: Téléverser une archive ZIP pour une installation directe (administrateur)
      description: Archive privée de 100 Mo maximum, validée sans extraction. Expire après une heure. Le chemin local n’est jamais exposé.
      parameters:
        - $ref: '#/components/parameters/csrfToken'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: Archive validée et identifiant du plugin lu dans son manifeste.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginArchive' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /plugins/installations/repository:
    post:
      tags: [Plugins]
      operationId: installPluginFromRepository
      summary: Installer depuis un dépôt actif de la box (administrateur)
      description: Planifie une installation native sérialisée avec celles du Market. La source et ses paramètres sont revérifiés dans le worker. Pour Fichier, configuration.path est l’identifiant opaque retourné par le téléversement, jamais un chemin local.
      parameters:
        - $ref: '#/components/parameters/csrfToken'
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{16,128}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [pluginId, source, configuration]
              properties:
                pluginId: { type: string }
                source: { type: string, enum: [github, url, file, samba] }
                configuration:
                  type: object
                  additionalProperties: { type: string }
      responses:
        '202':
          description: Installation planifiée ou déjà en cours avec la même clé.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginInstallation' }
        '200':
          description: Dernière installation retrouvée avec la même clé.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginInstallation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /plugins/{id}:
    parameters:
    - $ref: '#/components/parameters/PluginId'
    get:
      tags:
      - Plugins
      operationId: getPlugin
      summary: Lire la configuration générale d’un plugin (administrateur).
      responses:
        '200':
          description: Résultat de l’opération.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginDetails'
        default:
          description: 'Erreur explicite : droits, validation, plugin absent, conflit, Market indisponible ou mode
            démo.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: full
        in: query
        schema:
          type: boolean
          default: false
    patch:
      tags:
      - Plugins
      operationId: updatePlugin
      summary: Activer, désactiver et régler les options du plugin, dont le blocage des mises à jour.
      responses:
        '200':
          description: Résultat de l’opération.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginDetails'
        default:
          description: 'Erreur explicite : droits, validation, plugin absent, conflit, Market indisponible ou mode
            démo.'
          content:
            application/json:
              schema:
