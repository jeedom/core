            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /plugins/{id}/icon:
    parameters:
    - $ref: '#/components/parameters/PluginId'
    get:
      tags: [Plugins]
      operationId: getPluginIcon
      summary: Télécharger l’image PNG d’un plugin installé.
