        '404':
          $ref: '#/components/responses/VariableNotFound'
    patch:
      tags:
      - Variables
      operationId: updateVariable
      summary: Modifier la valeur d'une variable
      description: Seule la valeur change ; le nom est fixe, comme `dataStore.ajax.php` (action `save` avec id).
      requestBody:
