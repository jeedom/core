            démo.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      tags:
      - Plugins
      operationId: updatePluginDependencyAutoMode
      summary: Changer la gestion automatique des dépendances.
      responses:
