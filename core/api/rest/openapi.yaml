          description: Résultat de l’opération.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginDependencies'
        default:
          description: 'Erreur explicite : droits, validation, plugin absent, conflit, Market indisponible ou mode
            démo.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                auto:
                  type: boolean
              required:
              - auto
              additionalProperties: false
  /plugins/{id}/dependencies/install:
    parameters:
    - $ref: '#/components/parameters/PluginId'
    post:
      tags:
      - Plugins
      operationId: installPluginDependencies
      summary: Lancer l’installation native des dépendances.
      responses:
        '202':
          description: Résultat de l’opération.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginDependencies'
        default:
          description: 'Erreur explicite : droits, validation, plugin absent, conflit, Market indisponible ou mode
            démo.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      description: L’acceptation du lancement ne signifie pas que les dépendances sont installées. Relire leur état.
  /plugins/{id}/daemon:
    parameters:
    - $ref: '#/components/parameters/PluginId'
    get:
      tags:
      - Plugins
      operationId: getPluginDaemon
      summary: Lire l’état réel du démon.
      responses:
        '200':
          description: Résultat de l’opération.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginDaemon'
        default:
          description: 'Erreur explicite : droits, validation, plugin absent, conflit, Market indisponible ou mode
            démo.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      tags:
      - Plugins
      operationId: updatePluginDaemonAutoMode
      summary: Changer la gestion automatique du démon.
      responses:
        '200':
          description: Résultat de l’opération.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginDaemon'
        default:
          description: 'Erreur explicite : droits, validation, plugin absent, conflit, Market indisponible ou mode
            démo.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                auto:
                  type: boolean
              required:
              - auto
              additionalProperties: false
  /plugins/{id}/daemon/start:
    parameters:
    - $ref: '#/components/parameters/PluginId'
    post:
      tags:
      - Plugins
      operationId: startPluginDaemon
      summary: Démarrer ou redémarrer le démon.
      responses:
